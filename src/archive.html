          if (t.artist) artists.add(t.artist);
        });
        return { artists: [...artists], labels: [...labels] };
      }

      // Under each tracklist heading (the "name /////" seg-marker), drop the same
      // artist/label chips that live in the bottom-right bubble — but only the ones
      // for THAT track's segment — so each entry shows (and links) its own tags.
      function injectSegTags(body, rec) {
        const tracks = (window.__modemData && window.__modemData.tracks) || [];
        // Every name that ends up as a chip anywhere on the page, seg-marker or
        // not — returned to renderDetail for the bottom "all tags" summary,
        // which otherwise reads rec.artists/rec.labels directly and misses
        // anything that only ever got a chip via the per-track fallback below
        // (e.g. modem-238: 18 of its 20 segments have no rec.artists/labels
        // entry of their own at all — every one of those artists comes from
        // the track's OWN data, not the record's taxonomy — so the summary
        // silently showed only the 2 segments an admin had edited, looking
        // like editing had wiped the rest, when really they were never there).
        const allArtists = new Set(), allLabels = new Set();
        // Seed with the record's own taxonomy first (includes entries with no
        // seg at all, e.g. a bare-heading-promoted name — see normalizeHeadings
        // below — which never passes through the per-marker loop that adds the
        // fallback names below it) so the aggregate only ever gains coverage,
        // never loses any name the old rec.artists/rec.labels-only version had.
        (rec.artists || []).forEach((a) => { if (a.name) allArtists.add(a.name); });
        (rec.labels || []).forEach((l) => { if (l.name) allLabels.add(l.name); });
        const arts = {}, labs = {}; // seg → Set of names
        const add = (m, seg, n) => { if (seg != null && n) (m[seg] = m[seg] || new Set()).add(n); };
        (rec.artists || []).forEach((a) => add(arts, a.seg, a.name));
        // Seed label chips from the record's own taxonomy too, so a segment whose
        // embed died on the source's end (common in the 2015–2017 shows → the track
        // is dropped from the index) still shows its label chip.
        (rec.labels || []).forEach((l) => add(labs, l.seg, l.name));
        // Artists + labels come from the (possibly admin-edited) per-track data:
        // the artist of every track in each segment (surfacing compilation artists),
        // and its label list — so tag edits show here immediately. For un-edited
        // releases these equal the record's segment tags.
        // Segments that already name an artist via the record's own taxonomy (the heading).
        const artistHeadingSegs = new Set((rec.artists || []).filter((a) => a.seg != null && a.name).map((a) => String(a.seg)));
        // Segments an admin has explicitly edited via the inline seg editor — suppress
        // the per-track fallback below entirely for these, even if the admin cleared a
        // segment down to zero chips. Without this, clearing a segment (or replacing a
        // wrong track-sourced artist with nothing while only setting a label) just makes
        // the fallback re-inject the same wrong value right back, so the edit never
        // visibly sticks (e.g. modem-199 seg 2's "Boy Lucid" track was mis-tagged with
        // artist "Ostara" — its actual label — from the Bandcamp embed).
        const editedSegs = new Set((rec.segEditedSegs || []).map(String));
        // A segment counts as a genuine one-block various-artists compilation —
        // e.g. modem-205's bugtech, 5 Bandcamp iframes packed into ONE <p> right
        // after its marker — only when multiple embeds are physically packed
        // into that SAME <p>. Counting by how many tracks share a seg NUMBER
        // isn't safe: modem-224's "smile gang" heading is followed by 6 MORE
        // tracks, each in its OWN separate <p>, each preceded by its own
        // (unmarked — the scraper never generated their markers) name line;
        // every one of them ends up recorded with the same seg number purely
        // because they land nearest to "smile gang"'s marker, not because
        // they're actually compiled together. Surfacing all 7 names onto one
        // heading would be wrong — each of those needs its own heading, a
        // separate fix, not this one. Packed-<p> multi-iframe blocks are the
        // only case this guard should loosen for.
        const packedSegs = new Set();
        body.querySelectorAll('.seg-marker[data-seg]').forEach((marker) => {
          const sib = marker.nextElementSibling;
          if (sib && sib.querySelectorAll('iframe').length > 1) packedSegs.add(marker.getAttribute('data-seg'));
        });
        tracks.forEach((t) => (t.shows || []).forEach((s) => {
          if (s.slug !== rec.slug) return;
          if (editedSegs.has(String(s.seg))) return;
          // Surface a track's own artist as a chip when the segment has no artist
          // heading of its own (compilation / label / untagged segments — this is
          // what shows the various artists on a VA release), OR when the segment's
          // own <p> visibly packs multiple embeds together — every track in a
          // packed block deserves its own chip, not just the first. A single track
          // sharing a named heading's seg number stays suppressed; that's the
          // "foreign clip mis-grouped under a real heading" case this guard exists
          // for (modem-157's BCAA/OAKMILK mixup).
          // "Various Artists" is a Bandcamp/SoundCloud compilation placeholder, not
          // a real name (e.g. modem-59 seg 9's SPA tracks) — never surface it as a
          // chip, same as the list view already does for search/tag pages.
          const isPlaceholderArtist = /^(v\.?\s?a\.?|various\s+artists?)$/i.test(String(t.artist || '').trim());
          if (!isPlaceholderArtist && (!artistHeadingSegs.has(String(s.seg)) || packedSegs.has(String(s.seg)))) add(arts, s.seg, t.artist);
          (s.labels || []).forEach((l) => add(labs, s.seg, l));
        }));
        const chip = (kind, cls, n) => '<span class="chip ' + cls + ' clickable" data-kind="' + kind + '" data-name="' + esc(n) + '">' + esc(n) + '</span>';
        const slashes = '<span class="seg-slashes" aria-hidden="true">' + '/'.repeat(200) + '</span>';
        // Same entity styled two ways collapses to one key (strip case / spacing /
        // styling punctuation) — used to drop a label chip that just restates the artist.
        const hardKey = (s) => (s == null ? '' : String(s)).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[\s._*|~^;:`'"()\[\]\-]/g, '');
        // --- Normalize inconsistent source headings (e.g. modem-195) -------------------
        // Some shows write an artist BOTH as a plain <p>name</p> line AND a
        // <p>name /////</p> seg-marker (name shows twice), or as ONLY a plain line the
        // scraper never tied to a slash-heading (seg=null → renders as a bare name). Make
        // them uniform: (1) drop a plain <p> that just duplicates the seg-marker right
        // after it; (2) promote a bare <p> whose whole text matches a known artist/label
        // tag into the same "///// [chip]" format.
        (function normalizeHeadings() {
          const nameKey = (el) => hardKey((el.textContent || '').replace(/\/+/g, ' '));
          const segMarkers = [...body.querySelectorAll('.seg-marker[data-seg]')];
          const segKeys = new Set(segMarkers.map(nameKey));
          segMarkers.forEach((seg) => {
            const prev = seg.previousElementSibling;
            const k = nameKey(seg);
            if (k && prev && prev.tagName === 'P' && !prev.classList.contains('seg-marker') &&
                !prev.querySelector('iframe') && nameKey(prev) === k) prev.remove();
          });
          // A duplicate heading can also end up as loose TRAILING text merged onto the
          // end of an EARLIER <p> that already holds real embeds — e.g. modem-205's
          // "bugtech" compilation <p> (5 Bandcamp iframes) ends with a stray
          // "egoseed ///…" text node right before the real egoseed seg-marker (a
          // source/scrape artifact, not our markup). The pass above skips any <p>
          // containing an <iframe> on purpose (never touch real embed content), so
          // that trailing fragment survives as a bare, unstyled "name /////" line with
          // no chip — looking like a duplicate of the proper pill heading right under
          // it. Strip ONLY that trailing text node when it duplicates the very next
          // seg-marker's name; the embeds themselves are untouched.
          segMarkers.forEach((seg) => {
            const prev = seg.previousElementSibling;
            const k = nameKey(seg);
            if (!k || !prev || prev.tagName !== 'P' || prev.classList.contains('seg-marker')) return;
            const last = prev.lastChild;
            if (!last || last.nodeType !== 3 || !/\/{3,}/.test(last.textContent)) return;
            if (nameKey({ textContent: last.textContent }) === k) prev.removeChild(last);
          });
          // A third shape of the same artifact: trailing text whose name doesn't
          // match the NEXT marker (the pass above), because it isn't heading a new
          // segment at all — it's restating the name of the segment it's already
          // IN. E.g. modem-216's Eco Futurism Corporation compilation heads off a
          // blank marker (<p data-seg="12"></p>) whose chips already include
          // "Eco Futurism Corporation" (from the per-track label data below it);
          // the raw scrape also glued a redundant "Eco Futurism Corporation ///…"
          // fragment onto the tail of that same segment's first embed <p>. Strip
          // it only when the fragment's name matches a chip its OWN nearest
          // preceding marker already carries — so it never touches a fragment
          // that's the only trace of a genuinely untagged track (left as a bare
          // fallback heading instead, same as before).
          [...body.querySelectorAll('p')].forEach((p) => {
            if (!p.querySelector('iframe')) return;
            const last = p.lastChild;
            if (!last || last.nodeType !== 3 || !/\/{3,}/.test(last.textContent)) return;
            const k = nameKey({ textContent: last.textContent });
            if (!k) return;
            let marker = p.previousElementSibling;
            while (marker && !marker.classList.contains('seg-marker')) marker = marker.previousElementSibling;
            if (!marker) return;
            const ownSeg = marker.getAttribute('data-seg');
            const ownNames = [...(arts[ownSeg] || []), ...(labs[ownSeg] || [])].map(hardKey);
            if (ownNames.includes(k)) p.removeChild(last);
          });
          const taxo = {};
          (rec.labels || []).forEach((l) => { const k = hardKey(l.name); if (k && !taxo[k]) taxo[k] = { name: l.name, kind: 'label' }; });
          (rec.artists || []).forEach((a) => { const k = hardKey(a.name); if (k && !taxo[k]) taxo[k] = { name: a.name, kind: 'artist' }; });
          [...body.querySelectorAll('p')].forEach((p) => {
            if (p.classList.contains('seg-marker') || p.querySelector('iframe, a')) return;
            const txt = (p.textContent || '').trim();
            if (!txt || txt.length > 60) return;
            const k = hardKey(txt);
            const t = taxo[k];
            if (!t || segKeys.has(k)) return;                 // unknown, or already a real heading
            p.className = 'seg-marker seg-row';
            p.innerHTML = slashes + '<span class="seg-tags">' + chip(t.kind, t.kind === 'label' ? 'label-chip' : 'artist-chip', t.name) + '</span>';
          });
        })();
        body.querySelectorAll('.seg-marker[data-seg]').forEach((p) => {
          const seg = p.getAttribute('data-seg');
          let a = arts[seg] ? [...arts[seg]] : [];
          let l = labs[seg] ? [...labs[seg]] : [];
          // Now that a segment can pull artist chips from several tracks (the
          // multi-track compilation case above), the same person can show up
          // twice under slightly different spellings — a clean official name
          // from rec.artists next to a messier one resolved off a Bandcamp/SC
          // embed, e.g. modem-243's "daniel drabek" + "daniel drabek music", or
          // just a case variant like modem-129's "Ruoh" + "RUOH". Collapse a
          // later name into an earlier one when one hardKey is a prefix of the
          // other (insertion order already puts the record's own clean name
          // first) — but leave clearly different credits alone, e.g. modem-210's
          // "serpuline" next to the collab credit "wifi & serpuline" stays as two.
          if (a.length > 1) {
            const kept = [];
            const keptKeys = [];
            a.forEach((n) => {
              const k = hardKey(n);
              // Guard against two false-positive traps in prefix matching: an
              // empty key (a name that's ALL punctuation, e.g. "---__--____",
              // hardKeys to '' — and '' is a "prefix" of every string) would
              // swallow every other chip in the segment; a short key (e.g. "5"
              // or "nic") can coincidentally prefix a longer, unrelated name
              // ("500", "Nico Niquo"). Require both keys non-trivial in length
              // before treating a prefix relationship as the same entity.
              const isDup = keptKeys.some((kk) => kk === k ||
                (k.length >= 4 && kk.length >= 4 && (kk.indexOf(k) === 0 || k.indexOf(kk) === 0)));
              if (isDup) return;
              kept.push(n);
              keptKeys.push(k);
            });
            a = kept;
          }
          // Self-released tracks tag the same name as BOTH artist and label, rendering
          // two near-identical chips side by side (e.g. "MIND CLUB" + "Mind Club"). Drop
          // the redundant label chip — the artist chip already identifies the entity.
          if (a.length && l.length) {
            const aKeys = new Set(a.map(hardKey));
            l = l.filter((n) => !aKeys.has(hardKey(n)));
          }
          a.forEach((n) => allArtists.add(n));
          l.forEach((n) => allLabels.add(n));
          const chips = a.map((n) => chip('artist', 'artist-chip', n)).join('') + l.map((n) => chip('label', 'label-chip', n)).join('');
          // Source pages occasionally repeat a heading twice back-to-back with
          // nothing in between — e.g. modem-208's raw HTML has
          // <p data-seg="5">zeromandia, rené /////</p> immediately followed by
          // <p data-seg="6">zeromandia /////</p> right before the actual track,
          // no embed between them. That first marker has nothing playable under
          // it — the very next thing in the DOM is just the next heading — so
          // whatever it collected (its own heading name, or a track-fallback chip
          // that landed here by scrape accident rather than on the marker with
          // the real embed, e.g. modem-203's stray "goo2" heading and modem-205's
          // blank marker ahead of the bugtech compilation) really belongs to the
          // segment that follows, since that's the one with actual content.
          // Merge its chips forward onto the next marker's bucket (so nothing
          // is lost, just relocated to where the pill will render once instead
          // of twice), then drop it outright; not admin-gated, since a regular
          // visitor sees the same dead/duplicate line either way.
          if (p.nextElementSibling && p.nextElementSibling.classList.contains('seg-marker')) {
            const nextSeg = p.nextElementSibling.getAttribute('data-seg');
            if (a.length) { arts[nextSeg] = arts[nextSeg] || new Set(); a.forEach((n) => arts[nextSeg].add(n)); }
            if (l.length) { labs[nextSeg] = labs[nextSeg] || new Set(); l.forEach((n) => labs[nextSeg].add(n)); }
            p.remove();
            return;
          }
          // Logged-in admin (see isAdmin()) gets a pencil on every real heading, even
          // a chip-less one, so a segment the scraper never tagged can be fixed here
          // instead of only via the separate /admin per-track search tool.
          const pencil = isAdmin()
            ? '<button type="button" class="seg-edit-pencil" data-slug="' + esc(rec.slug) + '" data-seg="' + esc(seg) + '" title="edit tags">&#9998;</button>'
            : '';
          const tagsHtml = (chips || pencil)
            ? '<span class="seg-tags" data-slug="' + esc(rec.slug) + '" data-seg="' + esc(seg) + '">' + chips + pencil + '</span>'
            : '';
          // Early shows tuck the artist's real music links (soundcloud/bandcamp/…) INTO
          // the slash run — keep those. But drop the leading NAME and extend the slashes
          // out to the chips, so these read exactly like the recent "///// [chips]"
          // headings (universal formatting). The links survive (styled to blend in as
          // plain slashes, still clickable); a filler slash run stretches to the chips.
          if (p.querySelector('a')) {
            p.classList.add('seg-keep');
            // The name is sometimes wrapped in its own bold element instead of
            // sitting in a bare text node — either just the name on its own
            // (modem-03: <strong>Brood Ma</strong><a>///////</a>…) or the
            // WHOLE run, links included (modem-07: <strong>PAN <a>…</a>…
            // </strong>). The loop below only knows how to strip a leading
            // text node, so unwrap a bold wrapper that holds a link (exposing
            // its name-text + <a> children as plain top-level nodes the loop
            // already handles) and drop one outright that holds no link at
            // all (pure name, nothing worth keeping) — otherwise the whole
            // element is opaque to the loop and the bold name survives untouched.
            [...p.querySelectorAll(':scope > strong, :scope > b')].forEach((el) => {
              if (el.querySelector('a')) { while (el.firstChild) p.insertBefore(el.firstChild, el); el.remove(); }
              else el.remove();
            });
            for (const node of [...p.childNodes]) {
              if (node.nodeType === 3) {                                  // leading text node
                if (node.textContent.indexOf('/') === -1) { p.removeChild(node); continue; } // pure name → remove
                node.textContent = node.textContent.replace(/^[^/]*/, '');                    // strip name, keep slashes
              }
              break;                                                      // reached first slash / first <a> → name gone
            }
            p.innerHTML = '<span class="seg-links">' + p.innerHTML + '</span>' + slashes + tagsHtml;
            return;
          }
          const raw = p.textContent || '';
          if (!/\//.test(raw) && !chips && !pencil) return;
          // Plain "name /////" heading → drop the redundant name (the chips identify
          // the entry) and let the slashes stretch (flex + overflow clip) so the
          // chips sit at the right edge at any screen size — pure CSS, responsive.
          p.classList.add('seg-row');
          if (chips || pencil) {
            p.innerHTML = slashes + tagsHtml;
          } else {
            const nm = raw.replace(/[\s/]*\/[\s/]*$/, '').trim(); // no tags → keep the name as a fallback
            p.innerHTML = '<span class="seg-name">' + esc(nm) + '</span>' + slashes;
          }
        });
        return { artists: [...allArtists], labels: [...allLabels] };
      }

      let currentDetailRec = null; // for the seg-editor click handler below, which needs the live rec object
      function renderDetail(rec, records) {
        currentDetailRec = rec;
        // The nav bar has no link of its own for an archive slug — tell it
        // which top-level page this record actually belongs under (see
        // index.html's updateActiveNav) now that its type is known.
        if (window.updateActiveNavGlobal) window.updateActiveNavGlobal(rec.type === 'list' ? 'year-end-lists' : 'radio-show');
        detailInner.innerHTML =
          (rec.cover ? '<img class="detail-cover-big" src="' + esc(rec.cover) + '" alt="">' : '') +
          (rec.date ? '<div class="detail-date">' + esc(rec.date) + '</div>' : '') +
          '<div class="detail-title">' + esc(rec.title || rec.slug) + '</div>' +
          playerMarkup(rec.soundcloud, rec.mp3) +
          (rec.bodyHtml ? '<div class="modem-body">' + rec.bodyHtml + '</div>' : '');
        const body = detailInner.querySelector('.modem-body');
        let listTags = null, segTags = null;
        if (body) { normalizeEmbeds(body); if (rec.type === 'list') listTags = injectListTags(body); else { separateVideoSection(body); segTags = injectSegTags(body, rec); addPlayButtons(body); watchForBlockedEmbeds(body); } }
        initPlayer();

        const nb = neighbors(rec, records);
        setNav(prevBtn, nb.prev);
        setNav(nextBtn, nb.next);

        // For lists, the bottom section is built from the per-entry descriptions
        // (works even when the page has no artist/label taxonomy tags — e.g. 2024);
        // shows use segTags — every name that actually got a chip somewhere on
        // the page, including ones that only ever came from a track's own data
        // (see injectSegTags's allArtists/allLabels comment) rather than
        // rec.artists/rec.labels directly, which is missing exactly those.
        const useList = listTags && (listTags.artists.length || listTags.labels.length);
        const artists = useList ? listTags.artists.map((n) => ({ name: n })) : (segTags ? segTags.artists.map((n) => ({ name: n })) : (rec.artists || []));
        const labels = useList ? listTags.labels.map((n) => ({ name: n })) : (segTags ? segTags.labels.map((n) => ({ name: n })) : (rec.labels || []));
        tagsEl.hidden = true; // the old bottom-right floating bubble is gone
        if (artists.length || labels.length) {
          // All the show's artist/label chips live at the very END of the page now,
          // in clearly-labelled artists: / labels: groups. Every chip is a search
          // entry: click it to find every show featuring that artist/label.
          const chips = (arr, cls, kind) => arr.map((x) =>
            '<span class="chip ' + cls + ' clickable" data-kind="' + kind + '" data-name="' + esc(x.name) + '">' + esc(x.name) + '</span>'
          ).join('');
          const sec = document.createElement('div');
          sec.className = 'detail-alltags';
          sec.innerHTML =
            (artists.length ? '<div class="tag-group"><span class="tag-label">artists:</span>' + chips(artists, 'artist-chip', 'artist') + '</div>' : '') +
            (labels.length ? '<div class="tag-group"><span class="tag-label">labels:</span>' + chips(labels, 'label-chip', 'label') + '</div>' : '');
          detailInner.appendChild(sec);
        }

        detailView.hidden = false;
        searchView.hidden = true;
        detailView.scrollTop = 0;
        document.title = 'modem: ' + (rec.title || rec.slug);
      }

      function openTagChip(chip) {
        const kind = chip.getAttribute('data-kind') === 'label' ? 'label' : 'artist';
        const name = chip.getAttribute('data-name') || chip.textContent;
        // Open the floating search overlay filtered to this tag (layers over the
        // current page); fall back to the in-page search route if it's absent.
        if (window.modemSearch) window.modemSearch.open({ tag: { kind: kind, name: name } }, tagsEl);
        else { history.pushState({}, '', '/archive'); location.hash = 'tag=' + kind + ':' + encodeURIComponent(name); }
      }
      // every chip inside the detail (inline per-track + the bottom artists/labels
      // section) opens the same tag search
      detailInner.onclick = (e) => {
        const pencil = e.target.closest('.seg-edit-pencil');
        if (pencil) { const editor = openSegEditor(pencil); if (editor) wireSegEditor(editor, currentDetailRec); return; }
        const trackPencil = e.target.closest('.track-edit-pencil');
        if (trackPencil) { const editor = openTrackEditor(trackPencil); if (editor) wireTrackEditor(editor); return; }
        // .track-editor carries the .seg-editor class too, so this also covers clicks
        // inside it — both editors' own chips/inputs are handled by their wire*Editor.
        if (e.target.closest('.seg-editor')) return;
        const chip = e.target.closest('.chip.clickable');
        if (chip) openTagChip(chip);
      };

      backBtn.onclick = () => {
        // These detail pages are always reached from the radio-show grid, so
        // "back" returns there — deterministically, in a single click. Plain
        // history.back() was unreliable here: browsing shows via the ‹ › arrows
        // piles up #hash history entries, and backing across the hash boundary
        // raced the archive's own hashchange handler (which re-rendered the
        // search view), so it frequently took two clicks.
        if (window.loadPageGlobal) {
          window.history.pushState({}, '', '/radio-show');
          window.loadPageGlobal('radio-show');
        } else {
          window.location.href = '/radio-show';
        }
      };

      // -------- search mode (track/album-first) --------
      // Only ever searches `data.tracks` — every track/album played across all
      // shows, deduped, each carrying a "featured in modem NN" list (browsing
      // shows/lists directly by title had its own tab here once, but that was
      // pure duplication of the radio-show/year-end-lists grids and never
      // rendered right — dropped). `initial` seeds the view: { query } free
      // text, or { tag:{kind,name} } from a chip.
      const normKey = (s) => (s == null ? '' : String(s)).toLowerCase()
        .normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

      // radiostudent's short date format, "D. M. YYYY" — used both to sort search
      // results by recency and to pick a track's most recent appearance.
      function parseShowDate(s) {
        const m = /(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/.exec(s || '');
        return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : 0;
      }
      // A track tagged with BOTH a numbered show and a year-end list (the list is
      // usually published well after the show aired, e.g. Dec 2023 vs. an earlier
      // 2023 show) should sort by when it actually AIRED, not the list's publish
      // date — otherwise an earlier show jumps ahead of a later one just because it
      // also made a year-end list. Only fall back to a list's date for a track that
      // has no show appearance at all (a pure list-only pick). Kept in sync with the
      // identical helper in index.html's floating search.
      function latestShowDate(tk) {
        const shows = (tk.shows || []).filter((s) => s.type === 'show');
        const pool = shows.length ? shows : (tk.shows || []);
        return pool.reduce((max, s) => Math.max(max, parseShowDate(s.date)), 0);
      }

      // A year-end "best releases" list is a list of RELEASES, not individual
      // tracks — whatever it embeds (the whole album, key "bc:<albumId>:-", OR one
      // particular track off it, key "bc:<albumId>:<trackId>") is just there to say
      // "this release made the list," not to single out that one embed as distinct
      // content. That release is already separately indexed via whatever track(s) a
      // numbered show actually played off the same album. So an entry whose ONLY
      // appearances are in year-end lists (never an actual show) should never be its
      // own search hit: fold its badge onto every track from that album that IS
      // featured in a show (all of them, if a show played several — e.g. a
      // compilation) and drop the list-only entry. Only exception: if an album's
      // list-only entries have NO show-track sibling at all (the release was named
      // on a list but never actually played in a show), there's nothing to fold
      // onto, so they stay visible as the sole record of that release. Kept in sync
      // with the identical helper in index.html's floating search.
      function dedupeAlbumTracks(tracks) {
        const byAlbum = new Map();
        tracks.forEach((t) => {
          const m = /^bc:(\d+):/.exec(t.key || '');
          if (!m) return;
          const id = m[1];
          if (!byAlbum.has(id)) byAlbum.set(id, []);
          byAlbum.get(id).push(t);
        });
        const drop = new Set();
        const extraShows = new Map();
        byAlbum.forEach((group) => {
          const listOnly = group.filter((t) => (t.shows || []).length && (t.shows || []).every((s) => s.type === 'list'));
          if (!listOnly.length) return;
          const showTracks = group.filter((t) => !listOnly.includes(t) && (t.shows || []).some((s) => s.type === 'show'));
          if (!showTracks.length) return; // nothing to fold onto — keep the list entries visible
          listOnly.forEach((lo) => {
            drop.add(lo);
            showTracks.forEach((st) => extraShows.set(st, (extraShows.get(st) || []).concat(lo.shows || [])));
          });
        });
        if (!drop.size) return tracks;
        return tracks.filter((t) => !drop.has(t))
          .map((t) => (extraShows.has(t) ? Object.assign({}, t, { shows: (t.shows || []).concat(extraShows.get(t)) }) : t));
      }

      function renderSearch(data, initial) {
        initial = initial || {};
        // No single record here to read a type off (it's a tag/query search,
        // not one show or list) — default the nav underline to radio show,
        // the more common way search/tag browsing gets reached.
        if (window.updateActiveNavGlobal) window.updateActiveNavGlobal('radio-show');
        const tracks = dedupeAlbumTracks(data.tracks || []);
        const resultsEl = document.getElementById('archive-results');
        const searchEl = document.getElementById('archive-search');
        const countEl = document.getElementById('archive-count');
        const activeTagEl = document.getElementById('archive-active-tag');

        const state = { query: initial.query || '', tag: initial.tag || null };
        searchEl.value = state.query;

        function renderActiveTag() {
          if (state.tag) {
            activeTagEl.hidden = false;
            activeTagEl.innerHTML =
              '<span class="active-tag-pill">' +
                '<span class="active-tag-kind">' + (state.tag.kind === 'label' ? 'label' : 'artist') + '</span>' +
                esc(state.tag.name) +
                '<button type="button" class="active-tag-clear" aria-label="clear filter">×</button>' +
              '</span>';
          } else {
            activeTagEl.hidden = true;
            activeTagEl.innerHTML = '';
          }
        }

        const terms = () => { const q = state.query.trim().toLowerCase(); return q ? q.split(/\s+/) : []; };
        const hit = (hay, ts) => ts.every((t) => hay.indexOf(t) !== -1);
        function emptyMsg() {
          return '<div class="archive-empty">nothing matches ' +
            (state.tag ? state.tag.kind + ' “' + esc(state.tag.name) + '”' : '“' + esc(state.query) + '”') + '</div>';
        }

        function trackMatchesTag(tk, tag) {
          if (tag.kind === 'artist') {
            if (normKey(tk.artist) === normKey(tag.name)) return true;
            // Segment-heading fallback ONLY for tracks with no artist of their own.
            // Otherwise a foreign track mis-grouped under an artist's heading (e.g. an
            // unheaded clip trailing OAKMILK's section) would falsely match that artist.
            if (!tk.artist) return (tk.shows || []).some((s) => normKey(s.segLabel) === normKey(tag.name));
            return false;
          }
          // label: the track's own segment carried this label tag — not merely some
          // other track in the same show (which is what the old show-level match did).
          return (tk.shows || []).some((s) => (s.labels || []).some((n) => normKey(n) === normKey(tag.name)));
        }

        function trackRow(tk) {
          const cover = tk.artUrl || ''; // real track art only; blank square if missing
          const badges = (tk.shows || []).map((s) =>
            '<a class="track-show" href="/' + esc(s.slug) + '">' +
            esc(s.type === 'list' ? String(s.slug).replace(/-0$/, '').replace(/-/g, ' ') : 'modem ' + s.number) + '</a>'
          ).join('');
          const playable = (tk.kind === 'soundcloud' || !!tk.scPlay) && (tk.shows || []).some((s) => s.type === 'show');
          const thumb = '<span class="track-thumb-wrap' + (playable ? ' play' : '') + '">' +
            (cover ? '<img class="track-thumb" loading="lazy" src="' + esc(cover) + '" alt="">' : '<span class="track-thumb"></span>') +
            '</span>';
          // Always display Bandcamp's own title/artist — never SoundCloud's;
          // see index.html's trackItems for the full reasoning (a matched SC
          // upload is often a third-party repost whose own title/artist are
          // unreliable). Generic whole-album titles get a manually reviewed
          // fix via overrides.json tagEdits' "title" field instead.
          const title = tk.title || '(untitled)';
          const artist = tk.artist;
          return '<div class="track-row" data-key="' + esc(tk.key) + '">' +
            thumb +
            '<div class="track-main">' +
              '<div class="track-title">' + esc(title) + '</div>' +
              (artist ? '<div class="track-artist">' + esc(artist) + '</div>' : '') +
            '</div>' +
            '<div class="track-shows">' + badges + '</div>' +
          '</div>';
        }

        function draw() {
          const ts = terms();
          const filtered = tracks.filter((tk) => {
            if (state.tag && !trackMatchesTag(tk, state.tag)) return false;
            if (!ts.length) return true;
            return hit((tk.searchText || '').toLowerCase(), ts);
          }).sort((a, b) => latestShowDate(b) - latestShowDate(a));
          countEl.textContent = filtered.length + ' / ' + tracks.length + ' tracks';
          resultsEl.className = 'archive-tracklist';
          resultsEl.innerHTML = filtered.length ? filtered.map(trackRow).join('') : emptyMsg();
        }

        searchEl.oninput = () => { state.query = searchEl.value; draw(); };
        activeTagEl.onclick = (e) => {
          if (!e.target.closest('.active-tag-clear')) return;
          state.tag = null;
          if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
          renderActiveTag();
          draw();
        };
        // click a track row → play SoundCloud tracks in the mini-player (if present),
        // otherwise open the source; badges/source links keep their native behaviour.
        resultsEl.onclick = (e) => {
          if (e.target.closest('a')) return;
          const row = e.target.closest('.track-row');
          if (!row) return;
          const tk = tracks.find((x) => x.key === row.getAttribute('data-key'));
          if (!tk) return;
          if ((tk.kind === 'soundcloud' || tk.scPlay) && (tk.shows || []).some((s) => s.type === 'show') && window.modemPlayer) window.modemPlayer.playTrack(tk, tracks);
          else if (tk.link) window.open(tk.link, '_blank', 'noopener');
        };

        searchView.hidden = false;
        detailView.hidden = true;
        tagsEl.hidden = true;
        renderActiveTag();
        draw();
      }

      function route(data) {
        const records = data.records || [];
        const bySlug = {};
        records.forEach((r) => (bySlug[r.slug] = r));
        const raw = (location.hash || '').replace(/^#/, '');
        if (raw.indexOf('tag=') === 0) {
          const rest = raw.slice(4);
          const ci = rest.indexOf(':');
          const kind = ci > -1 && rest.slice(0, ci) === 'label' ? 'label' : 'artist';
          const name = decodeURIComponent(ci > -1 ? rest.slice(ci + 1) : rest);
          return renderSearch(data, { tag: { kind, name } });
        }
        if (raw.indexOf('q=') === 0) return renderSearch(data, { query: decodeURIComponent(raw.slice(2)) });
        const slug = slugFromPath() || slugFromHash();
        if (slug && bySlug[slug]) renderDetail(bySlug[slug], records);
        else renderSearch(data, {});
      }

      function withData(cb) {
        if (window.__modemData) return cb(window.__modemData);
        fetch('assets/modem-archive.json', { cache: 'no-cache' })
          .then((r) => r.json())
          .then((data) => {
            window.__modemData = { records: data.records || [], tracks: data.tracks || [] };
            window.__modemArchive = window.__modemData.records; // back-compat
            cb(window.__modemData);
          })
          .catch((err) => {
            detailInner.innerHTML = '<div class="archive-empty">could not load the archive data</div>';
            detailView.hidden = false;
            console.error('archive load failed', err);
          });
      }

      withData(route);
      // Let the shell re-route this already-mounted fragment from the current path
      // (detail↔detail nav, popstate) without re-fetching/re-injecting it.
      window.routeArchive = function () { withData(route); };

      if (!window.__archiveHashBound) {
        window.__archiveHashBound = true;
        window.addEventListener('hashchange', () => {
          // Only re-route while we're still on the /archive path. A browser/gesture
          // back OUT of the archive also clears the #hash and fires this event —
          // without the guard it would re-render the archive search view and fight
          // the SPA's popstate handler, making back take a second click.
          if (location.pathname.replace(/\/+$/, '') !== '/archive') return;
          if (document.getElementById('archive-detail-view')) withData(route);
        });
      }
    };

    window.initArchive();
  </script>
</body>
</html>
