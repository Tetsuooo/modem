<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>modem: archive</title>
  <script>
    // Only redirect if we're not already in the SPA context (same guard as the other subpages)
    if (window.location.pathname !== '/' &&
        !window.location.search.includes('embedded') &&
        !document.querySelector('nav') &&
        window === window.top) {
      // Preserve the #hash (e.g. #modem-11 or #tag=…) across the SPA redirect so a
      // directly-visited / shared / refreshed deep link still lands on the right show.
      window.location.replace('/?redirect=' + encodeURIComponent(window.location.pathname.replace(/^\/|\.html$/g, '')) + window.location.hash);
    }
  </script>
  <style>
    /* stop iOS Safari auto-inflating text on mobile (the "super oversized" show
       pages) — only real iOS does this, which is why emulators don't reproduce it. */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; font-family: Arial, sans-serif; background: transparent; }
    .content { box-sizing: border-box; width: 100%; }

    /* Custom scrollbar: thickness scales with viewport width instead of the
       browser's fixed default (measured ~15px on Windows/Chrome regardless of
       screen size). 0.293vw lands at ~7.5px — half of that default — on a 2K-wide
       (2560px) display, then scales down/up for other sizes within a sane range.
       Firefox only exposes "thin"/"auto"/"none" (no arbitrary width), so it gets
       a static thin bar rather than the same granular scaling. */
    :root { --sb-w: clamp(3px, 0.293vw, 9px); }
    ::-webkit-scrollbar { width: var(--sb-w); height: var(--sb-w); }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.6); }
    * { scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.35) transparent; }

    /* ===================== DETAIL (on-site archival page) =====================
       Its own fixed, scrollable layer floating over the animation, with the
       fixed nav (z 200000) still on top and clickable. */
    .modem-detail-page {
      position: fixed;
      /* top stops at the nav's real (JS-measured, see index.html) height instead
         of inset:0's 0 — otherwise this box's own scrollbar track ran full-height
         and showed through nav's translucent background. */
      top: var(--nav-h, 0px);
      right: 0; bottom: 0; left: 0;
      z-index: 150;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: transparent;
    }
    .modem-detail-page[hidden] { display: none; }
    .detail-inner-wrap {
      box-sizing: border-box;
      width: 100%;
      max-width: 760px; /* cover stays full-width; embeds are capped via --embed-w */
      margin: 0 auto;
      /* padding-top used to be the sole thing clearing nav (container ran full-height
         behind it); now the container itself already stops below nav, so subtract
         --nav-h back out to keep the content sitting at the same visual position. */
      padding: max(0px, calc(3.75rem - var(--nav-h, 0px))) 1rem 6rem;
    }

    .detail-back {
      position: fixed;
      top: 3.05rem;
      left: 0.8rem;
      z-index: 199999;
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: lowercase;
      border: 2px solid #000;
      background: rgba(255,255,255,0.9);
      padding: 0.3rem 0.65rem;
      cursor: pointer;
    }
    .detail-back:hover { background: #ffff00; }

    .detail-cover-big { width: 100%; display: block; background: #eee; }
    /* date: right-aligned, a bit below the cover */
    .detail-date { font-size: 1.2rem; font-weight: bold; opacity: 0.6; text-align: right; margin: 0.9rem 0 0; }
    .detail-title {
      font-size: clamp(1.6rem, 5vw, 3rem);
      font-weight: bold; text-transform: lowercase;
      margin: 0.15rem 0 1rem; line-height: 1.05; word-break: break-word;
    }

    /* ---- full-show player (hidden SoundCloud widget), matches the mini-player:
       the whole thing sits in a big white rectangle (no outline), and the play
       button is a plain icon (no square) ---- */
    .sc-player {
      position: relative; display: flex; align-items: center;
      background: #fff; color: #000; padding: 0.55rem 0.7rem; margin: 0 0 8rem;
    }
    /* Time + pop-out live in the top-right corner, OUTSIDE the normal flow —
       .sc-row (play button + timeline) is .sc-player's only flow child, so
       align-items:center above centers it in the box's full height instead of
       being pushed down by a time/pop-out row stacked above it. */
    .sc-time { position: absolute; top: 0.6rem; right: 2.9rem; font-size: 0.7rem; color: #aaa; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sc-popout {
      position: absolute; top: 0.3rem; right: 0.4rem;
      width: 1.9rem; height: 1.9rem; padding: 0;
      border: 0; background: transparent; color: rgba(0, 0, 0, 0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; line-height: 1; cursor: pointer;
    }
    .sc-popout:hover { color: #000; }
    /* Right-padded just enough to stop level with .sc-time's own right edge
       (not its full width, and well short of .sc-popout further right still) —
       .sc-bar reaches the last time digit, not the corner overlay's left edge. */
    .sc-row { display: flex; align-items: center; gap: 0.7rem; width: 100%; padding-right: 2.2rem; }
    .sc-toggle {
      width: 2.6rem; height: 2.6rem; flex: none; padding: 0;
      border: 0; background: transparent; color: #000;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; line-height: 1; cursor: pointer;
    }
    .sc-toggle:hover { color: #888; }
    .sc-bar { flex: 1; height: 4px; background: #e9e9e9; border: 1px solid #000; position: relative; cursor: pointer; }
    .sc-progress { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #000; }
    .sc-playhead { position: absolute; top: -4px; bottom: -4px; left: 0; width: 2px; background: #000; transform: translateX(-50%); }
    .sc-hidden { position: absolute; top: -9999px; left: -9999px; width: 320px; height: 200px; border: 0; }
    .sc-hidden-native { position: absolute; top: -9999px; left: -9999px; }
    /* Shown only if the SoundCloud widget never confirms it loaded (typically an
       ad/tracker blocker on the visitor's end) — see initPlayer()'s showFallback(). */
    .sc-fallback { display: none; color: #000; font-weight: bold; text-transform: lowercase; font-size: 0.95rem; text-decoration: underline; margin: 0 0 1.6rem; }
    .sc-fallback.show { display: inline-block; }

    /* prev / next show navigation — both in the top-right corner */
    .detail-nav {
      position: fixed; top: 3.05rem; z-index: 199999;
      width: 2.2rem; height: 2rem; padding: 0;
      border: 2px solid #000; background: rgba(255,255,255,0.9); color: #000;
      font-size: 1.2rem; font-weight: bold; line-height: 1; cursor: pointer;
    }
    .detail-nav:hover { background: #ffff00; }
    .detail-nav[hidden] { display: none; }
    .detail-nav.prev { right: 3.7rem; }
    .detail-nav.next { right: 1.4rem; }

    .detail-section-label {
      font-weight: bold; text-transform: lowercase; font-size: 0.8rem;
      letter-spacing: 0.03em; opacity: 0.55; margin: 1.4rem 0 0.5rem;
    }

    .modem-body { font-size: 1rem; line-height: 1.5; word-break: break-word; }
    .modem-body p { margin: 0.4rem 0; }
    .modem-body a { color: #0645ad; }
    /* separation between entries: gap ABOVE each heading, tight to its own embed */
    .modem-body .seg-marker { scroll-margin-top: 5rem; margin: 1.8rem 0 0.3rem; }
    /* heading = stretching slashes · tag chips pinned to the right edge */
    .modem-body .seg-marker.seg-row { display: flex; align-items: center; flex-wrap: wrap; }
    .modem-body .seg-marker .seg-name { flex: 0 0 auto; }
    /* real "/" characters that stretch to fill; clip ONLY the horizontal overflow
       (overflow-x: clip leaves the vertical axis visible, so glyphs aren't cut —
       unlike overflow: hidden, which clips both axes) */
    /* contain: inline-size makes the element's width independent of its (very long,
       nowrap) slash content, so the 1000px+ text can never transiently overflow and
       push the layout viewport wide (which rendered subpages oversized on Android). */
    .modem-body .seg-marker .seg-slashes { flex: 1 1 0; min-width: 0; overflow: hidden; contain: inline-size; white-space: nowrap; margin-right: 0.35rem; }
    .modem-body .seg-marker .seg-tags { flex: 0 0 auto; white-space: nowrap; }
    /* early-show heading: name + hyperlinked slashes on the left (kept, wraps if
       long), the same chips pinned to the right edge — like the plain headings */
    .modem-body .seg-marker.seg-keep { display: flex; align-items: center; flex-wrap: wrap; }
    /* name-stripped: the linked slash runs sit at content width, a filler slash run
       stretches out to the chips. Links blend in as plain slashes but stay clickable. */
    .modem-body .seg-marker.seg-keep .seg-links { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
    /* linked slash-runs blend in (same black) but keep a faint underline so they're
       discoverable/tappable — including on mobile, where there's no hover. */
    .modem-body .seg-marker.seg-keep .seg-links a { color: inherit; text-decoration: underline; text-decoration-color: rgba(0,0,0,0.4); text-underline-offset: 2px; }
    .modem-body .seg-marker.seg-keep .seg-links a:hover { text-decoration-color: #000; }
    .modem-body .seg-marker.seg-keep .seg-tags { margin-left: 0; }
    .modem-body .seg-marker .chip { margin: 0 0 0 0.3rem; cursor: pointer; vertical-align: middle; }
    .modem-body .seg-marker .chip:hover { background: #ffff00; }
    /* Play trigger(s) moved from beside the embed to the front of the heading bar
       (see addPlayButtons()) — a packed multi-track segment gets one per track,
       in order, so the whole row is playable without scanning down to the embeds. */
    .modem-body .seg-marker .seg-play-buttons { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 0.3rem; margin-right: 0.5rem; }
    .modem-body .seg-marker .seg-play-buttons .embed-play { margin-top: 0; }
    /* year-end list entries: description on the left, chips pushed to the right edge,
       with the same gap between entries as the radio-show tracklists */
    .modem-body p.list-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; margin: 1.8rem 0 0.3rem; }
    .modem-body .list-desc { flex: 1 1 auto; min-width: 0; }
    .modem-body .list-tags { flex: 0 0 auto; white-space: nowrap; }
    .modem-body .list-tags .chip { margin: 0 0 0 0.3rem; cursor: pointer; vertical-align: middle; }
    .modem-body .list-tags .chip:hover { background: #ffff00; }

    /* all artists/labels, at the very bottom of the detail page */
    .detail-alltags { margin: 2.5rem 0 1rem; padding-top: 1.3rem; border-top: 1px solid rgba(0,0,0,0.18); }
    .detail-alltags .tag-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem; margin-bottom: 0.9rem; }
    .detail-alltags .tag-label { font-weight: bold; text-transform: lowercase; opacity: 0.55; margin-right: 0.25rem; }
    .detail-alltags .chip { cursor: pointer; }
    .detail-alltags .chip:hover { background: #ffff00; }
    .modem-body iframe { max-width: 100%; border: 0; margin: 0.25rem 0 1rem; }
    /* Track embeds. The iframe boxes are identical width (measured), but the two
       providers fill their box differently — SoundCloud stretches full-width while
       Bandcamp's player caps its own content, so at full width they LOOK unequal.
       Capping both to a width Bandcamp also fills makes them visually match.
       (Tune --embed-w if Bandcamp still shows empty space.) */
    .modem-body { --embed-w: 560px; }
    .modem-body iframe[src*="soundcloud"],
    .modem-body iframe[src*="bandcamp"] { display: block; width: 100%; max-width: var(--embed-w); height: 120px; }
    .modem-body iframe[src*="bandcamp"][src*="size=small"] { height: 42px; }
    .modem-body iframe[src*="youtube"] { width: 100%; aspect-ratio: 16 / 9; height: auto; }
    /* Shown only next to a SoundCloud embed that never gains real size (blocked
       client-side) — see watchForBlockedEmbeds(). Its own play/edit buttons (if
       any — see addPlayButtons()) move in here too, to the link's right, rather
       than being left stranded next to the now-invisible collapsed iframe. */
    .modem-body .embed-fallback { display: none; align-items: center; gap: 0.5rem; margin: -0.7rem 0 1rem; }
    .modem-body .embed-fallback.show { display: flex; }
    .embed-fallback-link { font-size: 0.85rem; }
    /* .embed-play's own margin-top nudges it down against a normal embed's top
       edge (see below) — here it's already vertically centered against the
       link's own line, so that nudge would just push it off-center. */
    .embed-fallback .embed-play { margin-top: 0; }
    /* "play in the modem player" button, sitting beside a playable track's embed
       (see addPlayButtons()) — a wrapper SPAN scoped to just this one iframe (not
       its parent <p>, which can hold more than one embed back to back — flexing
       that shared <p> laid multiple tracks out side by side instead of stacked).
       Top-aligned (not centered) so the button sits up by the embed's top-right,
       not floating at its vertical middle. */
    .modem-body .embed-row { display: flex; align-items: flex-start; gap: 0.4rem; }
    .embed-play {
      flex: none; border: 0; background: transparent; color: #000; cursor: pointer;
      font-size: 1.1rem; line-height: 1; padding: 0; margin-top: 0.65rem;
      display: flex; align-items: center; justify-content: center;
    }
    .embed-play:hover { color: #888; }
    /* Per-track edit pencil (sits next to .embed-play, admin-only) — fixes one
       specific track's OWN artist/labels (data.tracks[], via tagEdits), unlike
       the segment-heading pencil (rec.artists/labels for the whole heading,
       ambiguous when several tracks share one heading — see track-editor.js
       comment further down for why both exist). */
    .track-edit-pencil {
      flex: none; border: 1.5px solid rgba(0,0,0,0.3); border-radius: 999px; background: transparent;
      color: rgba(0,0,0,0.55); cursor: pointer; font-size: 0.75rem; line-height: 1;
      padding: 0.14rem 0.4rem; align-self: flex-start; margin-top: 0.15rem;
    }
    .track-edit-pencil:hover { color: #000; border-color: #000; background: #ffff00; }
    .track-editor-host { margin: -0.6rem 0 1rem; }
    .track-editor-host .seg-editor { display: flex; }
    /* Buffer + subtle hairline between the music tracklist and the trailing
       YouTube "video" section (the appended Drupal video field). */
    .modem-body .modem-video-divider { margin: 3.25rem 0 2.25rem; border: 0; border-top: 1px solid rgba(0, 0, 0, 0.18); }
    @keyframes segflash { 0% { background: #ffff00; } 100% { background: transparent; } }
    .seg-flash { animation: segflash 1.8s ease-out; }

    .detail-source { margin-top: 1.6rem; font-size: 0.8rem; opacity: 0.7; }
    .detail-source a { color: #0645ad; }

    /* ---- frameless artists+labels: just the bubbles, collapsed, bottom-right ---- */
    /* The toggle is pinned bottom-right and stays put; the chips open UPWARD above
       it (absolutely positioned) so expanding never shoves the button around. */
    .detail-tags {
      position: fixed; right: 0.9rem; bottom: 0.9rem;
      z-index: 199998;
      text-align: right; background: transparent; border: 0;
    }
    .detail-tags[hidden] { display: none; }
    .detail-tags > summary {
      list-style: none; display: inline-block; cursor: pointer;
      font-weight: bold; text-transform: lowercase; font-size: 0.8rem;
      background: #000; color: #fff; border: 2px solid #000;
      border-radius: 999px; padding: 0.2rem 0.7rem; user-select: none;
    }
    .detail-tags > summary::-webkit-details-marker { display: none; }
    .detail-tags[open] > summary { background: #ffff00; color: #000; }
    .detail-tags-body {
      position: absolute; right: 0; bottom: calc(100% + 0.5rem);
      width: min(340px, 84vw); max-height: 50vh; overflow-y: auto; text-align: right;
    }
    .detail-tags:not([open]) .detail-tags-body { display: none; }
    .chip {
      display: inline-block; font-size: 0.78rem; font-weight: bold;
      border: 1.5px solid #000; border-radius: 999px;
      padding: 0.12rem 0.6rem; margin: 0 0 0.35rem 0.35rem;
      background: rgba(255,255,255,0.96); color: #000; text-decoration: none;
    }
    .chip.clickable { cursor: pointer; }
    .chip.clickable:hover { background: #ffff00; }
    .chip:not(.clickable) { opacity: 0.55; }
    .chip.label-chip { background: rgba(224,224,255,0.96); }
    .chip.label-chip.clickable:hover { background: #ffff00; }

    /* ---- inline segment-tag editor (logged-in admin only) ---- */
    .seg-edit-pencil {
      border: 1.5px dashed rgba(0,0,0,0.35); border-radius: 999px; background: transparent;
      color: rgba(0,0,0,0.45); cursor: pointer; font-size: 0.72rem; line-height: 1;
      padding: 0.14rem 0.4rem; margin: 0 0 0.35rem 0.35rem; vertical-align: middle;
    }
    .seg-edit-pencil:hover { color: #000; border-color: #000; background: #ffff00; }
    .seg-editor { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .seg-edit-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.2rem; }
    .seg-edit-label { font-size: 0.68rem; font-weight: bold; text-transform: lowercase; opacity: 0.5; margin-right: 0.15rem; }
    .seg-edit-chip {
      display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.78rem; font-weight: bold;
      border: 1.5px solid #000; border-radius: 999px; padding: 0.1rem 0.15rem 0.1rem 0.6rem;
      background: rgba(255,255,255,0.96); color: #000;
    }
    .seg-edit-rm { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0 0.3rem; }
    .seg-edit-rm:hover { color: #b91c1c; }
    .seg-edit-add {
      font-family: Arial, sans-serif; font-size: 0.78rem; border: 1.5px dashed rgba(0,0,0,0.35); border-radius: 999px;
      padding: 0.12rem 0.55rem; width: 9rem; background: transparent;
    }
    .seg-edit-add:focus { outline: none; border-color: #000; border-style: solid; }
    .seg-edit-done {
      border: 1.5px solid #000; border-radius: 999px; background: #fff; color: #000; cursor: pointer;
      font-size: 0.72rem; font-weight: bold; text-transform: lowercase; padding: 0.12rem 0.6rem;
    }
    .seg-edit-done:hover { background: #ffff00; }
    .seg-edit-status { font-size: 0.68rem; opacity: 0.6; white-space: nowrap; }
    .seg-edit-chip-name { cursor: pointer; }
    .seg-edit-chip-name:hover { text-decoration: underline; text-decoration-style: dotted; }
    .seg-edit-add-btn {
      border: 1.5px solid #000; border-radius: 999px; background: #fff; color: #000; cursor: pointer;
      font-size: 0.78rem; font-weight: bold; line-height: 1; padding: 0.1rem 0.45rem;
    }
    .seg-edit-add-btn:hover { background: #ffff00; }
    .seg-edit-rename {
      font-family: Arial, sans-serif; font-size: 0.78rem; font-weight: bold; border: 1.5px solid #000; border-radius: 999px;
      padding: 0.1rem 0.55rem; width: 9rem; background: #fff;
    }
    .seg-edit-rename:focus { outline: none; }

    /* ===================== SEARCH (hidden power-feature; not in nav) ===================== */
    .modem-archive {
      position: fixed; top: var(--nav-h, 0px); right: 0; bottom: 0; left: 0;
      z-index: 150; overflow-y: auto; overflow-x: hidden;
      background: transparent;
    }
    .modem-archive[hidden] { display: none; }
    .archive-inner-wrap { box-sizing: border-box; width: 100%; max-width: 1100px; margin: 0 auto; padding: max(0px, calc(3.75rem - var(--nav-h, 0px))) 1rem 3rem; }
    .archive-controls { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,0.92); border: 2px solid #000; padding: 0.6rem 0.75rem; margin-bottom: 1rem; }
    #archive-search { width: 100%; box-sizing: border-box; font-family: Arial, sans-serif; font-size: 1rem; font-weight: bold; padding: 0.55rem 0.7rem; border: 2px solid #000; outline: none; }
    #archive-search:focus { background: #ffffcc; }
    /* active tag filter ("showing every show featuring …") */
    .archive-active-tag { margin-top: 0.55rem; }
    .archive-active-tag[hidden] { display: none; }
    .active-tag-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.82rem; font-weight: bold;
      background: #000; color: #fff; border: 2px solid #000;
      border-radius: 999px; padding: 0.2rem 0.35rem 0.2rem 0.7rem;
    }
    .active-tag-kind { text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.06em; opacity: 0.6; }
    .active-tag-clear {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.15rem; height: 1.15rem; flex: none;
      border: 0; border-radius: 999px; background: #fff; color: #000;
      font-size: 0.9rem; line-height: 1; cursor: pointer; padding: 0;
    }
    .active-tag-clear:hover { background: #ffff00; }
    .archive-filters { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.55rem; flex-wrap: wrap; }
    #archive-count { margin-left: auto; font-size: 0.8rem; font-weight: bold; opacity: 0.7; }
    .archive-empty { padding: 2rem 0; text-align: center; font-weight: bold; opacity: 0.7; }

    /* ---- track/album-first result list ---- */
    .archive-tracklist { display: flex; flex-direction: column; gap: 0.4rem; }
    .track-row {
      display: flex; align-items: center; gap: 0.7rem;
      background: rgba(255,255,255,0.94); border: 2px solid #000;
      padding: 0.4rem 0.5rem; cursor: pointer;
    }
    .track-row:hover { box-shadow: 0 0 0 3px #ffff00; }
    .track-thumb { width: 52px; height: 52px; flex: none; object-fit: cover; background: #eee; display: block; position: relative; }
    .track-thumb-wrap { position: relative; flex: none; width: 52px; height: 52px; }
    .track-thumb-wrap.play::after {
      content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: #fff; background: rgba(0,0,0,0.35); opacity: 0; transition: opacity 0.12s;
    }
    .track-row:hover .track-thumb-wrap.play::after { opacity: 1; }
    .track-main { flex: 1; min-width: 0; }
    .track-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.8rem; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-shows { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: flex-end; max-width: 42%; }
    .track-show {
      font-size: 0.72rem; font-weight: bold; text-decoration: none; text-transform: lowercase;
      border: 1.5px solid #000; border-radius: 999px; padding: 0.08rem 0.5rem;
      background: #fff; color: #000; white-space: nowrap;
    }
    .track-show:hover { background: #ffff00; }
    .track-src { flex: none; text-decoration: none; color: #000; font-weight: bold; font-size: 1.05rem; padding: 0 0.3rem; }
    .track-src:hover { color: #0645ad; }

    @media (max-width: 480px) {
      .detail-inner-wrap, .archive-inner-wrap { padding-top: max(0px, calc(4.6rem - var(--nav-h, 0px))); }
      .detail-back { top: 3.85rem; }
      .detail-nav { top: 3.85rem; }
    }
  </style>
</head>
<body>
  <div class="content">
    <!-- Detail: the on-site version of a show / year-end list -->
    <div class="modem-detail-page" id="archive-detail-view" hidden>
      <button class="detail-back" type="button">← back</button>
      <button class="detail-nav prev" id="detail-prev" type="button" hidden aria-label="previous show">‹</button>
      <button class="detail-nav next" id="detail-next" type="button" hidden aria-label="next show">›</button>
      <div class="detail-inner-wrap"><div class="detail-page-inner"></div></div>
      <details class="detail-tags" id="detail-tags" hidden>
        <summary>artists &amp; labels</summary>
        <div class="detail-tags-body"></div>
      </details>
    </div>

    <!-- Search: kept as a hidden power-feature, reachable at /archive with no #show -->
    <div class="modem-archive" id="archive-search-view" hidden>
      <div class="archive-inner-wrap">
        <div class="archive-controls">
          <input id="archive-search" type="text" autocomplete="off" spellcheck="false"
                 placeholder="search tracks, artists, shows…">
          <div id="archive-active-tag" class="archive-active-tag" hidden></div>
          <div class="archive-filters">
            <span id="archive-count"></span>
          </div>
        </div>
        <div id="archive-results" class="archive-tracklist"></div>
      </div>
    </div>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    window.initArchive = function initArchive() {
      const detailView = document.getElementById('archive-detail-view');
      const searchView = document.getElementById('archive-search-view');
      if (!detailView || !searchView) return; // markup not injected yet

      const detailInner = detailView.querySelector('.detail-page-inner');
      const tagsEl = document.getElementById('detail-tags');
      const tagsBody = tagsEl.querySelector('.detail-tags-body');
      const backBtn = detailView.querySelector('.detail-back');
      const prevBtn = document.getElementById('detail-prev');
      const nextBtn = document.getElementById('detail-next');
      function goToSlug(slug) {
        if (!slug) return;
        // Clean path URL (/modem-142); re-route in place. The shell's popstate
        // handler re-routes when the user navigates back across these entries.
        history.pushState({}, '', '/' + slug);
        withData(route);
      }
      prevBtn.onclick = () => goToSlug(prevBtn.dataset.slug);
      nextBtn.onclick = () => goToSlug(nextBtn.dataset.slug);

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      }

      // ---- inline segment-tag editing (logged in via /admin, password saved to
      // localStorage there) — lets an admin fix a segment heading's artist/label
      // chips directly on a show page, instead of only via the /admin per-track
      // search tool. Writes overrides.json's "segEdits" (see apply-overrides.js);
      // a different axis from /admin's "tagEdits" (per-track, not per-segment). ----
      function isAdmin() { return !!localStorage.getItem('modem-admin-pw'); }

      // ---- shared track-identity lookups (embed src → data.tracks[] key) ----
      // Mirrors build-track-index.js's soundcloudId(): decode the url= param once,
      // then take the first run of 5+ digits — robust to both the plain
      // "tracks/<id>" src format and newer doubly-encoded URN srcs
      // ("tracks/soundcloud%253Atracks%253A<id>"), where a literal "tracks/(\d+)"
      // match fails.
      function scTrackId(src) {
        const u = decodeURIComponent(((src || '').match(/[?&]url=([^&]+)/) || [])[1] || '');
        return (u.match(/(\d{5,})/) || [])[1] || null;
      }
      // Mirrors build-track-index.js's keyOf() for Bandcamp: "bc:<albumId>:<trackId>",
      // "-" standing in for whichever half isn't present in this particular embed.
      function bcTrackKey(src) {
        const alb = ((src || '').match(/album=(\d+)/) || [])[1] || null;
        const trk = ((src || '').match(/track=(\d+)/) || [])[1] || null;
        return (alb || trk) ? 'bc:' + (alb || '-') + ':' + (trk || '-') : null;
      }
      const segEditKey = (slug, seg) => slug + '::' + seg;
      const segEditState = {}; // segEditKey → { artists: [...], labels: [...] } while a pencil is open

      // Fetch the CURRENT overrides.json fresh (not a stale copy from page load)
      // before merging in this one change, so two edits made close together don't
      // clobber each other by overwriting with an outdated snapshot — the same
      // hazard the match-review approvals flow hit earlier (see approvals.json).
      async function saveSegEdit(slug, seg, artists, labels) {
        const res = await fetch('/assets/overrides.json', { cache: 'no-cache' });
        const current = res.ok ? await res.json() : {};
        const overrides = {
          tagMerges: current.tagMerges || {},
          tagEdits: current.tagEdits || {},
          segEdits: current.segEdits || {},
        };
        overrides.segEdits[slug] = overrides.segEdits[slug] || {};
        overrides.segEdits[slug][seg] = { artists, labels };
        const r = await fetch('/save-overrides', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: localStorage.getItem('modem-admin-pw'), overrides }),
        });
        const j = await r.json().catch(() => ({ ok: false, error: 'bad response' }));
        if (!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
      }

      // Every known artist/label name across the whole archive, for the add/rename
      // fields' <datalist> suggestions — typing "Boy" should surface the existing
      // "Boy Lucid" instead of an admin accidentally creating a near-duplicate
      // fragmented variant (the same problem tagMerges cleans up after the fact).
      let cachedTagNames = { artist: null, label: null };
      function allTagNames(kind) {
        if (cachedTagNames[kind]) return cachedTagNames[kind];
        const set = new Set();
        ((window.__modemData && window.__modemData.records) || []).forEach((r) => {
          (kind === 'label' ? r.labels : r.artists || []).forEach((t) => { if (t && t.name) set.add(t.name); });
        });
        const list = [...set].sort((a, b) => a.localeCompare(b));
        cachedTagNames[kind] = list;
        return list;
      }
      const segEditListId = (kind) => 'seg-edit-' + kind + '-list';
      function ensureTagDatalists() {
        ['artist', 'label'].forEach((kind) => {
          const id = segEditListId(kind);
          if (document.getElementById(id)) return;
          const dl = document.createElement('datalist');
          dl.id = id;
          dl.innerHTML = allTagNames(kind).map((n) => '<option value="' + esc(n) + '">').join('');
          document.body.appendChild(dl);
        });
      }
      // Attaching `list` up front makes Chrome pop the FULL ~2500-name dropdown the
      // instant the field is focused, before the admin has typed anything to filter
      // by — not useful, just noisy. Leave `list` off until there's actually text to
      // match against, so suggestions only ever appear once the admin starts typing.
      function wireDeferredDatalist(inp) {
        inp.addEventListener('input', () => {
          if (inp.value.trim()) inp.setAttribute('list', inp.dataset.list);
          else inp.removeAttribute('list');
        });
      }
      function segEditChip(name, kind) {
        return '<span class="seg-edit-chip" data-name="' + esc(name) + '">' +
          '<span class="seg-edit-chip-name" data-kind="' + kind + '" title="click to rename">' + esc(name) + '</span>' +
          '<button type="button" class="seg-edit-rm" data-kind="' + kind + '" title="remove">&times;</button></span>';
      }
      function segEditGroupHtml(label, kind, names) {
        return '<span class="seg-edit-group">' +
          '<span class="seg-edit-label">' + label + '</span>' +
          names.map((n) => segEditChip(n, kind)).join('') +
          '<input type="text" class="seg-edit-add" data-kind="' + kind + '" data-list="' + segEditListId(kind) + '" placeholder="+ add, Enter">' +
          '<button type="button" class="seg-edit-add-btn" data-kind="' + kind + '" title="add">+</button>' +
          '</span>';
      }
      function renderSegEditor(slug, seg) {
        const st = segEditState[segEditKey(slug, seg)];
        return '<span class="seg-editor" data-slug="' + esc(slug) + '" data-seg="' + esc(seg) + '">' +
          segEditGroupHtml('artists:', 'artist', st.artists) +
          segEditGroupHtml('labels:', 'label', st.labels) +
          '<button type="button" class="seg-edit-done">done</button>' +
          '<span class="seg-edit-status"></span>' +
          '</span>';
      }
      function findSegEditor(slug, seg) {
        return detailInner.querySelector('.seg-editor[data-slug="' + CSS.escape(slug) + '"][data-seg="' + CSS.escape(seg) + '"]');
      }
      function openSegEditor(pencil) {
        const slug = pencil.getAttribute('data-slug'), seg = pencil.getAttribute('data-seg');
        const wrap = pencil.closest('.seg-tags');
        if (!wrap) return null;
        const artists = [...wrap.querySelectorAll('.chip.artist-chip')].map((c) => c.getAttribute('data-name'));
        const labels = [...wrap.querySelectorAll('.chip.label-chip')].map((c) => c.getAttribute('data-name'));
        segEditState[segEditKey(slug, seg)] = { artists, labels };
        ensureTagDatalists();
        wrap.outerHTML = renderSegEditor(slug, seg);
        return findSegEditor(slug, seg);
      }
      function closeSegEditor(editor, rec) {
        // Re-run the normal (non-edit) chip render for just this one segment,
        // pulling from the just-edited state — avoids reloading the whole page.
        const slug = editor.getAttribute('data-slug'), seg = editor.getAttribute('data-seg');
        const st = segEditState[segEditKey(slug, seg)];
        rec.artists = (rec.artists || []).filter((a) => String(a.seg) !== seg);
        rec.labels = (rec.labels || []).filter((l) => String(l.seg) !== seg);
        st.artists.forEach((n) => rec.artists.push({ name: n, url: null, seg: Number(seg) }));
        st.labels.forEach((n) => rec.labels.push({ name: n, url: null, seg: Number(seg) }));
        // Mark this segment as admin-edited so injectSegTags suppresses the per-track
        // fallback even when cleared to zero chips (matches apply-overrides.js's
        // server-side r.segEditedSegs, so the in-session render and a fresh reload agree).
        rec.segEditedSegs = rec.segEditedSegs || [];
        if (!rec.segEditedSegs.includes(Number(seg))) rec.segEditedSegs.push(Number(seg));
        const body = detailInner.querySelector('.modem-body');
        if (body) injectSegTags(body, rec);
      }
      function wireSegEditor(editor, rec) {
        const slug = editor.getAttribute('data-slug'), seg = editor.getAttribute('data-seg');
        const st = segEditState[segEditKey(slug, seg)];
        // Look the status element up FRESH every time rather than closing over the
        // one that exists right now — every add/remove replaces the editor's whole
        // outerHTML (see below), which detaches this element from the document, so a
        // captured reference silently stops being visible after the very first edit
        // even though later saves keep succeeding (status just never updates again).
        function liveStatusEl() {
          const live = findSegEditor(slug, seg);
          return live ? live.querySelector('.seg-edit-status') : null;
        }
        function persist() {
          const s0 = liveStatusEl();
          if (s0) s0.textContent = 'saving…';
          saveSegEdit(slug, seg, st.artists, st.labels)
            .then(() => {
              const s1 = liveStatusEl();
              if (s1) { s1.textContent = 'saved'; setTimeout(() => { if (s1.isConnected) s1.textContent = ''; }, 1500); }
            })
            .catch((e) => {
              const s2 = liveStatusEl();
              if (s2) s2.textContent = 'save failed: ' + e.message;
            });
        }
        editor.querySelectorAll('.seg-edit-add').forEach((inp) => wireDeferredDatalist(inp));
        editor.querySelectorAll('.seg-edit-rm').forEach((btn) => btn.onclick = () => {
          const name = btn.closest('.seg-edit-chip').getAttribute('data-name');
          const kind = btn.getAttribute('data-kind');
          const arr = kind === 'label' ? st.labels : st.artists;
          const i = arr.indexOf(name);
          if (i > -1) arr.splice(i, 1);
          editor.outerHTML = renderSegEditor(slug, seg);
          wireSegEditor(findSegEditor(slug, seg), rec);
          persist();
        });
        function commitAdd(inp) {
          const v = inp.value.trim();
          if (!v) return;
          const kind = inp.getAttribute('data-kind');
          const arr = kind === 'label' ? st.labels : st.artists;
          if (!arr.includes(v)) arr.push(v);
          editor.outerHTML = renderSegEditor(slug, seg);
          wireSegEditor(findSegEditor(slug, seg), rec);
          persist();
        }
        // Enter-to-add and an explicit "+" button both commit the same way — the
        // button is a safety net in case Enter-key handling ever misses (browser
        // quirk, IME composition, focus landing somewhere unexpected) with no
        // visible error, which is exactly what made a real add look like "nothing
        // happens" even though remove/save were both working underneath.
        editor.querySelectorAll('.seg-edit-add').forEach((inp) => inp.onkeydown = (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          commitAdd(inp);
        });
        editor.querySelectorAll('.seg-edit-add-btn').forEach((btn) => btn.onclick = () => {
          const inp = btn.closest('.seg-edit-group').querySelector('.seg-edit-add');
          if (inp) commitAdd(inp);
        });
        // Click a chip's name to rename it in place (swap to a text input,
        // pre-filled, same datalist suggestions as the add field).
        editor.querySelectorAll('.seg-edit-chip-name').forEach((nameEl) => nameEl.onclick = () => {
          const chip = nameEl.closest('.seg-edit-chip');
          const oldName = chip.getAttribute('data-name');
          const kind = nameEl.getAttribute('data-kind');
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'seg-edit-rename';
          input.value = oldName;
          input.dataset.list = segEditListId(kind);
          chip.replaceWith(input);
          wireDeferredDatalist(input);
          input.focus();
          input.select();
          // Commit/cancel run directly off the keydown, not off a subsequent blur —
          // calling .blur() programmatically and waiting for the blur event to fire
          // proved unreliable (in some environments — including automated testing
          // here — a not-really-OS-focused input's blur event just never arrives).
          // blur is kept only as a secondary fallback for "clicked away without
          // pressing Enter"; the `done` guard stops it from double-firing after
          // Enter/Escape already committed synchronously.
          let done = false;
          const rerender = () => { editor.outerHTML = renderSegEditor(slug, seg); wireSegEditor(findSegEditor(slug, seg), rec); };
          const commit = (v) => {
            if (done) return;
            done = true;
            const arr = kind === 'label' ? st.labels : st.artists;
            const i = arr.indexOf(oldName);
            if (i > -1) { if (v) arr[i] = v; else arr.splice(i, 1); } // renamed to empty = remove
            rerender();
            if (v !== oldName) persist();
          };
          const cancel = () => {
            if (done) return;
            done = true;
            rerender();
          };
          input.onkeydown = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); commit(input.value.trim()); }
            else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
          };
          input.onblur = () => commit(input.value.trim());
        });
        const done = editor.querySelector('.seg-edit-done');
        if (done) done.onclick = () => closeSegEditor(editor, rec);
      }

      // ---- Per-track editor: fixes ONE specific track's own artist/labels -----
      // (data.tracks[], via tagEdits) — unlike the segment-heading editor above
      // (rec.artists/labels, via segEdits), which is ambiguous whenever more than
      // one track shares a heading (a compilation segment), since a segment-level
      // edit has no way to say which name belongs to which of several tracks.
      // The chips here are NOT displayed anywhere new — the segment heading keeps
      // showing exactly what it already shows; this only records which of those
      // names (or any other known tag) this specific track's own data should
      // carry, so search/the mini-player find it correctly.
      const trackEditState = {}; // track key → { artists: [...], labels: [...] } while open
      async function saveTrackEdit(key, artists, labels) {
        const res = await fetch('/assets/overrides.json', { cache: 'no-cache' });
        const current = res.ok ? await res.json() : {};
        const overrides = {
          tagMerges: current.tagMerges || {},
          tagEdits: current.tagEdits || {},
          segEdits: current.segEdits || {},
        };
        overrides.tagEdits[key] = { artist: artists.join(' & '), artists, labels };
        const r = await fetch('/save-overrides', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: localStorage.getItem('modem-admin-pw'), overrides }),
        });
        const j = await r.json().catch(() => ({ ok: false, error: 'bad response' }));
        if (!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
      }
      function renderTrackEditor(key) {
        const st = trackEditState[key];
        return '<span class="seg-editor track-editor" data-track-key="' + esc(key) + '">' +
          segEditGroupHtml('artists:', 'artist', st.artists) +
          segEditGroupHtml('labels:', 'label', st.labels) +
          '<button type="button" class="seg-edit-done">done</button>' +
          '<span class="seg-edit-status"></span>' +
          '</span>';
      }
      function findTrackEditor(key) {
        return detailInner.querySelector('.track-editor[data-track-key="' + CSS.escape(key) + '"]');
      }
      function openTrackEditor(pencil) {
        const key = pencil.getAttribute('data-track-key');
        // .embed-row wraps a show page's iframe (see addPlayButtons); a year-end
        // list's entry has no iframe of its own to wrap (injectListTags' pencil
        // sits in a plain description row instead) — .list-row is that row.
        const wrap = pencil.closest('.embed-row, .list-row');
        if (!wrap || findTrackEditor(key)) return null; // already open
        const tk = ((window.__modemData && window.__modemData.tracks) || []).find((t) => t.key === key);
        if (!tk) return null;
        const artists = (Array.isArray(tk.artists) && tk.artists.length) ? tk.artists.slice() : (tk.artist ? [tk.artist] : []);
        const show = (tk.shows || []).find((s) => currentDetailRec && s.slug === currentDetailRec.slug) || (tk.shows || [])[0];
        const labels = (show && show.labels) ? show.labels.slice() : [];
        trackEditState[key] = { artists, labels };
        ensureTagDatalists();
        const host = document.createElement('div');
        host.className = 'track-editor-host';
        host.innerHTML = renderTrackEditor(key);
        wrap.parentNode.insertBefore(host, wrap.nextSibling);
        return findTrackEditor(key);
      }
      function closeTrackEditor(editor) {
        const host = editor.closest('.track-editor-host');
        if (host) host.remove();
      }
      function wireTrackEditor(editor) {
        const key = editor.getAttribute('data-track-key');
        const st = trackEditState[key];
        function liveStatusEl() {
          const live = findTrackEditor(key);
          return live ? live.querySelector('.seg-edit-status') : null;
        }
        function persist() {
          const s0 = liveStatusEl();
          if (s0) s0.textContent = 'saving…';
          saveTrackEdit(key, st.artists, st.labels)
            .then(() => {
              const s1 = liveStatusEl();
              if (s1) { s1.textContent = 'saved'; setTimeout(() => { if (s1.isConnected) s1.textContent = ''; }, 1500); }
            })
            .catch((e) => {
              const s2 = liveStatusEl();
              if (s2) s2.textContent = 'save failed: ' + e.message;
            });
        }
        function rerenderInPlace() {
          const host = editor.closest('.track-editor-host');
          host.innerHTML = renderTrackEditor(key);
          wireTrackEditor(findTrackEditor(key));
        }
        editor.querySelectorAll('.seg-edit-add').forEach((inp) => wireDeferredDatalist(inp));
        editor.querySelectorAll('.seg-edit-rm').forEach((btn) => btn.onclick = () => {
          const name = btn.closest('.seg-edit-chip').getAttribute('data-name');
          const kind = btn.getAttribute('data-kind');
          const arr = kind === 'label' ? st.labels : st.artists;
          const i = arr.indexOf(name);
          if (i > -1) arr.splice(i, 1);
          rerenderInPlace();
          persist();
        });
        function commitAdd(inp) {
          const v = inp.value.trim();
          if (!v) return;
          const kind = inp.getAttribute('data-kind');
          const arr = kind === 'label' ? st.labels : st.artists;
          if (!arr.includes(v)) arr.push(v);
          rerenderInPlace();
          persist();
        }
        editor.querySelectorAll('.seg-edit-add').forEach((inp) => inp.onkeydown = (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          commitAdd(inp);
        });
        editor.querySelectorAll('.seg-edit-add-btn').forEach((btn) => btn.onclick = () => {
          const inp = btn.closest('.seg-edit-group').querySelector('.seg-edit-add');
          if (inp) commitAdd(inp);
        });
        editor.querySelectorAll('.seg-edit-chip-name').forEach((nameEl) => nameEl.onclick = () => {
          const chip = nameEl.closest('.seg-edit-chip');
          const oldName = chip.getAttribute('data-name');
          const kind = nameEl.getAttribute('data-kind');
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'seg-edit-rename';
          input.value = oldName;
          input.dataset.list = segEditListId(kind);
          chip.replaceWith(input);
          wireDeferredDatalist(input);
          input.focus();
          input.select();
          let done = false;
          const commit = (v) => {
            if (done) return;
            done = true;
            const arr = kind === 'label' ? st.labels : st.artists;
            const i = arr.indexOf(oldName);
            if (i > -1) { if (v) arr[i] = v; else arr.splice(i, 1); }
            rerenderInPlace();
            if (v !== oldName) persist();
          };
          const cancel = () => {
            if (done) return;
            done = true;
            rerenderInPlace();
          };
          input.onkeydown = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); commit(input.value.trim()); }
            else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
          };
          input.onblur = () => commit(input.value.trim());
        });
        const done = editor.querySelector('.seg-edit-done');
        if (done) done.onclick = () => closeTrackEditor(editor);
      }

      function slugFromHash() {
        return decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
      }
      // Clean-URL slug taken straight from the path (/modem-142 → "modem-142").
      // "archive" (the bare search route) is not a record slug.
      function slugFromPath() {
        const p = decodeURIComponent(location.pathname || '').replace(/^\/|\/$/g, '').trim();
        return (p && p !== 'archive') ? p : '';
      }

      // ---- custom full-show player over a hidden SoundCloud widget ----
      // A handful of shows (the earliest, #1, plus a couple of later ones —
      // #100/#200 are the anniversary compilation specials, which never had a
      // single full-mix recording to begin with) were never uploaded to
      // SoundCloud at all, so there's no widget to build the custom player
      // around — sc is null, not a broken/unresolved lookup. Radio Študent's
      // own site still hosts the original broadcast as a plain mp3 though, so
      // fall back to the browser's native <audio> element for those rather
      // than showing nothing.
      function playerMarkup(sc, mp3) {
        // No pop-out button here — window.modemPlayer (the floating mini-player)
        // is built entirely around the SoundCloud widget API, so there's nothing
        // for a raw mp3 to hand off to. Otherwise identical markup/classes to the
        // SoundCloud player below (initPlayer() branches on which hidden media
        // element it finds and wires the matching API), so it reads as the same
        // player, not a fallback bolted on the side.
        if ((!sc || !sc.api) && mp3) {
          return '<div class="sc-player sc-player-native">' +
            '<div class="sc-time"><span class="sc-cur">0:00</span> / <span class="sc-dur">–:––</span></div>' +
            '<div class="sc-row">' +
              '<button class="sc-toggle" type="button" aria-label="play">▶</button>' +
              '<div class="sc-bar"><div class="sc-progress"></div><div class="sc-playhead"></div></div>' +
            '</div>' +
            '</div>' +
            '<audio class="sc-hidden-native" preload="none" src="' + esc(mp3) + '"></audio>';
        }
        if (!sc || !sc.api) return '';
        const src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(sc.api) +
          '&auto_play=false&buying=false&sharing=false&download=false&show_artwork=false' +
          '&show_comments=false&show_playcount=false&visual=false&hide_related=true';
        return '<div class="sc-player">' +
          '<div class="sc-time"><span class="sc-cur">0:00</span> / <span class="sc-dur">–:––</span></div>' +
          '<button class="sc-popout" type="button" title="continue in the floating player" aria-label="continue in the floating player">&#8599;</button>' +
          '<div class="sc-row">' +
            '<button class="sc-toggle" type="button" aria-label="play">▶</button>' +
            '<div class="sc-bar"><div class="sc-progress"></div><div class="sc-playhead"></div></div>' +
          '</div>' +
          '</div>' +
          (sc.track ? '<a class="sc-fallback" href="' + esc(sc.track) + '" target="_blank" rel="noopener">&#8599; listen on soundcloud</a>' : '') +
          '<iframe class="sc-hidden" allow="autoplay" src="' + src + '"></iframe>';
      }
      // Native <audio>-backed twin of the SoundCloud player below, for the rare
      // show with no SoundCloud upload at all (see playerMarkup()) — same
      // toggle/bar/time markup and CSS, wired to HTMLMediaElement's own
      // play/pause/timeupdate instead of the SC.Widget API.
      function initNativePlayer(wrap, audio) {
        const toggle = wrap.querySelector('.sc-toggle');
        const bar = wrap.querySelector('.sc-bar');
        const prog = wrap.querySelector('.sc-progress');
        const playhead = wrap.querySelector('.sc-playhead');
        const curEl = wrap.querySelector('.sc-cur');
        const durEl = wrap.querySelector('.sc-dur');
        const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
        const seek = (frac) => { const p = Math.max(0, Math.min(1, frac)) * 100; prog.style.width = p + '%'; playhead.style.left = p + '%'; };
        audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
        audio.addEventListener('play', () => { toggle.textContent = '❚❚'; });
        audio.addEventListener('pause', () => { toggle.textContent = '▶'; });
        audio.addEventListener('ended', () => { toggle.textContent = '▶'; seek(0); curEl.textContent = '0:00'; });
        audio.addEventListener('timeupdate', () => {
          if (audio.duration) seek(audio.currentTime / audio.duration);
          curEl.textContent = fmt(audio.currentTime);
        });
        toggle.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
        bar.onclick = (e) => {
          if (!audio.duration) return;
          const r = bar.getBoundingClientRect();
          const frac = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
          audio.currentTime = frac * audio.duration;
          seek(frac);
        };
      }
      function initPlayer() {
        const wrap = detailInner.querySelector('.sc-player');
        if (!wrap) return;
        const nativeAudio = detailInner.querySelector('.sc-hidden-native');
        if (nativeAudio) { initNativePlayer(wrap, nativeAudio); return; }
        const iframe = detailInner.querySelector('.sc-hidden');
        const fallback = detailInner.querySelector('.sc-fallback');
        if (!iframe) return;
        const toggle = wrap.querySelector('.sc-toggle');
        const bar = wrap.querySelector('.sc-bar');
        const prog = wrap.querySelector('.sc-progress');
        const playhead = wrap.querySelector('.sc-playhead');
        const curEl = wrap.querySelector('.sc-cur');
        const durEl = wrap.querySelector('.sc-dur');
        const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
        const seek = (frac) => { const p = Math.max(0, Math.min(1, frac)) * 100; prog.style.width = p + '%'; playhead.style.left = p + '%'; };
        // The widget script/iframe are on soundcloud.com, which trackers/ad blockers
        // sometimes block outright. If the widget never confirms it's actually ready
        // (script never loads, or loads but the iframe navigation itself was blocked),
        // swap the dead player for a plain link instead of leaving a button that does
        // nothing. showFallback is REVERSIBLE — a slow-but-not-actually-blocked
        // connection could still fire READY after the timeout already gave up, and
        // a visitor shouldn't get stuck looking at "listen on soundcloud" for a
        // track that works fine a couple seconds later. Both timeouts are also more
        // generous than the tracklist-embed check (10s here vs. that one's 6s) since
        // this is a single widget, not up to a dozen on the page at once.
        let widget = null, durationMs = 0, readyTimer = null, currentPositionMs = 0;
        function showFallback() { wrap.style.display = 'none'; if (fallback) fallback.classList.add('show'); }
        function restoreFromFallback() { wrap.style.display = ''; if (fallback) fallback.classList.remove('show'); }
        function ready() {
          widget = SC.Widget(iframe);
          readyTimer = setTimeout(showFallback, 10000);
          widget.bind(SC.Widget.Events.READY, () => {
            clearTimeout(readyTimer);
            restoreFromFallback();
            widget.getDuration((d) => { durationMs = d; durEl.textContent = fmt(d); });
          });
          widget.bind(SC.Widget.Events.PLAY, () => { toggle.textContent = '❚❚'; });
          widget.bind(SC.Widget.Events.PAUSE, () => { toggle.textContent = '▶'; });
          widget.bind(SC.Widget.Events.FINISH, () => { toggle.textContent = '▶'; seek(0); curEl.textContent = '0:00'; });
          widget.bind(SC.Widget.Events.PLAY_PROGRESS, (e) => { seek(e.relativePosition); curEl.textContent = fmt(e.currentPosition); currentPositionMs = e.currentPosition; });
        }
        toggle.onclick = () => { if (widget) widget.toggle(); };
        bar.onclick = (e) => { if (!widget || !durationMs) return; const r = bar.getBoundingClientRect(); const frac = (e.clientX - r.left) / r.width; seek(frac); widget.seekTo(frac * durationMs); };
        const popout = wrap.querySelector('.sc-popout');
        if (popout) popout.onclick = () => {
          if (!window.modemPlayer || !currentDetailRec) return;
          if (widget) widget.pause(); // avoid two copies playing over each other
          window.modemPlayer.playShow(currentDetailRec, 'left', currentPositionMs);
        };
        (function wait(n) {
          if (window.SC && SC.Widget) { ready(); return; }
          if (n > 0) { setTimeout(() => wait(n - 1), 100); return; }
          // The widget script itself never loaded in the first 10s — show the
          // fallback, but keep checking (slower cadence) for another ~50s in case
          // it was just a slow load, not an actual block. Self-corrects via ready()
          // if it does show up late.
          showFallback();
          (function slowRetry(m) {
            if (!m) return;
            setTimeout(() => { if (window.SC && SC.Widget) ready(); else slowRetry(m - 1); }, 2000);
          })(25);
        })(100);
      }

      // Turn SoundCloud's big square "visual" player into the classic horizontal
      // one so it matches the compact Bandcamp widgets (uniform 120px, set in CSS).
      // Bandcamp embeds are left as-authored — including the thin "small" bars,
      // which stay 42px. The hidden full-show widget (.sc-hidden) is outside
      // .modem-body, so it's never touched here.
      function normalizeEmbeds(root) {
        // Radiostudent's editor leaves a long "~~~~~~…" divider (hundreds of
        // literal tildes, likely a stray horizontal-rule convention that never
        // got converted to markup) trailing right after the last embed on ~30
        // shows — pure decorative noise, not part of any track's name or
        // credit. Strip a long tilde run wherever a <p>'s last text child ends
        // in one, dropping the node entirely if that's all it contained.
        root.querySelectorAll('p').forEach((p) => {
          const last = p.lastChild;
          if (!last || last.nodeType !== 3 || !/~{8,}/.test(last.textContent)) return;
          last.textContent = last.textContent.replace(/~{8,}/g, '');
          if (!last.textContent.trim()) p.removeChild(last);
        });
        root.querySelectorAll('iframe').forEach((f) => {
          const src = f.getAttribute('src') || '';
          if (!/w\.soundcloud\.com\/player/i.test(src)) return;
          let s = /visual=true/i.test(src)
            ? src.replace(/visual=true/i, 'visual=false')
            : (/visual=false/i.test(src) ? src : src + (src.indexOf('?') > -1 ? '&' : '?') + 'visual=false');
          s = s.replace(/show_comments=true/i, 'show_comments=false')
               .replace(/show_teaser=true/i, 'show_teaser=false');
          // CRITICAL: hide_related=true stops SoundCloud from auto-playing an
          // unrelated "recommended" track when the embed finishes.
          s = /hide_related=/i.test(s) ? s.replace(/hide_related=(true|false)/i, 'hide_related=true')
            : s + (s.indexOf('?') > -1 ? '&' : '?') + 'hide_related=true';
          f.setAttribute('src', s);
          f.setAttribute('height', '120'); f.setAttribute('width', '100%');
        });
        // radiostudent's own markup repeats every SoundCloud embed's "artist · title"
        // as a hyperlink caption right beneath the player — a bare <p> or <div> (format
        // varies by scrape era) whose only links point to soundcloud.com. Once the
        // player itself renders, that's pure redundant clutter — drop it unconditionally
        // (including when the track is dead/blocked and the box shows nothing: a stray
        // caption with no player above it reads as broken, not helpful). BUT first stash
        // the track-specific link (not just the artist profile) onto the iframe as a
        // data attribute — watchForBlockedEmbeds() reuses it to point a blocked-embed
        // fallback at the exact track instead of the artist's general SC page.
        root.querySelectorAll('iframe').forEach((f) => {
          if (!/w\.soundcloud\.com\/player/i.test(f.getAttribute('src') || '')) return;
          const holder = f.closest('p') || f.parentElement;
          const cap = holder && holder.nextElementSibling;
          if (!cap || (cap.tagName !== 'P' && cap.tagName !== 'DIV') || cap.querySelector('iframe')) return;
          const links = Array.prototype.slice.call(cap.querySelectorAll('a'));
          if (!links.length || !links.every((a) => /soundcloud\.com/i.test(a.getAttribute('href') || ''))) return;
          const clone = cap.cloneNode(true);
          clone.querySelectorAll('a').forEach((a) => a.remove());
          if ((clone.textContent || '').replace(/[\s·|/\\,.–—-]+/g, '') !== '') return; // real prose, not a bare caption
          // The track-page link has a deeper path (/artist/track-slug) than a bare
          // profile link (/artist); prefer it, falling back to whatever's there.
          const trackLink = links.find((a) => /soundcloud\.com\/[^/?#]+\/[^/?#]+/i.test(a.getAttribute('href') || '')) || links[links.length - 1];
          f.dataset.scLink = trackLink.getAttribute('href') || '';
          if (links[0]) f.dataset.scArtist = (links[0].textContent || '').trim();
          cap.remove();
        });
      }

      // A client-side blocker (ad blocker / tracking protection) can defeat a
      // SoundCloud embed two different ways — a cosmetic CSS rule that collapses it
      // to zero size (box never renders) while the network request still succeeds,
      // OR a network-level block of soundcloud.com/sndcdn.com that leaves the box
      // full-sized but permanently empty inside. Catch both: (1) after a short delay,
      // any iframe with no real size is presumed cosmetically hidden; (2) in parallel,
      // bind the SoundCloud Widget API's READY event per iframe (same mechanism the
      // full-show player uses) — if it never fires, the request itself was blocked.
      // Either signal swaps that embed for a plain link so a blocked visitor gets
      // something clickable instead of dead space — labelled "track title by
      // artist" when both are known, using data.tracks' resolved metadata (from
      // SoundCloud's own oEmbed response, so title and artist are already split
      // cleanly) rather than the scraped caption text, which sometimes only had
      // one link/name (e.g. an early-format caption with no separate title link)
      // and would otherwise show the artist name twice. The link target still
      // prefers the exact track URL normalizeEmbeds() stashed from the caption
      // over data.tracks' artist-profile link. Only meaningful for LIVE tracks —
      // a dead track's blank box is a real 404, not a blocking artifact, and
      // (like every embed now) already lost its caption.
      function watchForBlockedEmbeds(body) {
        const tracks = (window.__modemData && window.__modemData.tracks) || [];
        const liveById = new Map(
          tracks.filter((t) => t.kind === 'soundcloud' && t.key)
                .map((t) => [String(t.key).replace(/^sc:/, ''), t])
        );
        const frames = Array.prototype.filter.call(
          body.querySelectorAll('iframe'),
          (f) => /w\.soundcloud\.com\/player/i.test(f.getAttribute('src') || '')
        );
        if (!frames.length) return;
        function showFallbackFor(f) {
          if (f.dataset.fallbackShown) return;
          f.dataset.fallbackShown = '1';
          const id = scTrackId(f.getAttribute('src'));
          const tk = id && liveById.get(id);
          const href = f.dataset.scLink || (tk && tk.link) || null;
          if (!href) return;
          const title = (tk && tk.title) || null;
          const artist = (tk && tk.artist) || f.dataset.scArtist || null;
          // "title by artist" when both are known and actually different (a
          // caption with only one link/name would otherwise repeat itself).
          let label = null;
          if (title && artist && title.trim().toLowerCase() !== artist.trim().toLowerCase()) label = title + ' by ' + artist;
          else label = title || artist || null;
          const a = document.createElement('a');
          a.className = 'embed-fallback-link';
          a.href = href; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = '↗ ' + (label ? label + ' ' : '') + 'on soundcloud';
          const row = document.createElement('span');
          row.className = 'embed-fallback show';
          row.appendChild(a);
          // Move (not clone, so their click handlers survive) this iframe's own
          // play/edit buttons — see addPlayButtons() — into the fallback row,
          // to the link's right, instead of leaving them stranded next to what's
          // now an invisible, collapsed iframe.
          const embedRow = f.closest('.embed-row');
          if (embedRow) embedRow.querySelectorAll('.embed-play, .track-edit-pencil').forEach((btn) => row.appendChild(btn));
          (f.closest('p') || f).insertAdjacentElement('afterend', row);
        }
        setTimeout(() => {
          frames.forEach((f) => { if (f.offsetWidth === 0 || f.offsetHeight === 0) showFallbackFor(f); });
        }, 1500);
        (function wait(n) {
          if (window.SC && SC.Widget) {
            frames.forEach((f) => {
              const widget = SC.Widget(f);
              const t = setTimeout(() => showFallbackFor(f), 6000);
              widget.bind(SC.Widget.Events.READY, () => clearTimeout(t));
            });
          } else if (n > 0) {
            setTimeout(() => wait(n - 1), 100);
          } else {
            frames.forEach(showFallbackFor); // the widget API itself never loaded — blocked
          }
        })(60);
      }

      // A small "▶" next to every track embed (working or blocked) that's playable
      // in the site's own mini-player — an alternative to fiddling with the inline
      // widget, or the only way to actually hear a blocked one without leaving the
      // page. Same playability rule the search/shuffle player already uses: a
      // SoundCloud embed, or a Bandcamp embed with an approved SoundCloud match
      // (scPlay), and actually featured in a show (not a year-end list's whole-album
      // pick). Uses window.modemPlayer — the same shuffle mini-player the radio-show
      // page's "play random track" button drives.
      function addPlayButtons(body) {
        const tracks = (window.__modemData && window.__modemData.tracks) || [];
        const byKey = new Map(tracks.map((t) => [t.key, t]));
        const canPlayHere = (tk) => (tk.kind === 'soundcloud' || !!tk.scPlay) && (tk.shows || []).some((s) => s.type === 'show');
        const admin = isAdmin();
        // The nearest real heading an embed's <p> belongs to: walk backward through
        // siblings (past any other embeds/credit lines packed into the same segment)
        // until a seg-marker turns up. Stops at a plain, un-promoted heading line
        // instead of skipping past it to an unrelated earlier marker — that only
        // happens on the handful of old/placeholder pages left as-is, where the
        // button just stays beside the embed (the pre-existing behavior).
        const findOwnMarker = (p) => {
          let node = p && p.previousElementSibling;
          while (node) {
            if (node.classList && node.classList.contains('seg-marker')) return node;
            if (node.tagName === 'P' && !node.querySelector('iframe, a, div')) return null;
            node = node.previousElementSibling;
          }
          return null;
        };
        body.querySelectorAll('iframe').forEach((f) => {
          const src = f.getAttribute('src') || '';
          let key = null;
          if (/w\.soundcloud\.com\/player/i.test(src)) { const id = scTrackId(src); key = id ? 'sc:' + id : null; }
          else if (/bandcamp\.com\/EmbeddedPlayer/i.test(src)) key = bcTrackKey(src);
          if (!key) return;
          const tk = byKey.get(key);
          if (!tk) return;
          const playable = canPlayHere(tk);
          if (!playable && !admin) return; // nothing to attach here otherwise
          if (f.dataset.hasPlayBtn) return;
          f.dataset.hasPlayBtn = '1';
          // Wrap just THIS iframe (not its parent <p>) — radiostudent's own markup
          // sometimes puts two <iframe>s back to back in one <p> with nothing
          // separating them, and flexing that shared <p> laid both tracks out
          // side by side instead of stacked. A wrapper scoped to one iframe keeps
          // each track's row independent regardless of what else shares its parent.
          const wrap = document.createElement('span');
          wrap.className = 'embed-row';
          f.parentNode.insertBefore(wrap, f);
          wrap.appendChild(f);
          if (playable) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'embed-play';
            btn.title = 'play in the modem player';
            btn.setAttribute('aria-label', 'play in the modem player');
            btn.textContent = '▶';
            btn.onclick = () => { if (window.modemPlayer) window.modemPlayer.playTrack(tk, null, 'left'); };
            const marker = findOwnMarker(wrap.parentElement);
            if (marker) {
              let group = marker.querySelector(':scope > .seg-play-buttons');
              if (!group) {
                group = document.createElement('span');
                group.className = 'seg-play-buttons';
                marker.insertBefore(group, marker.firstChild);
              }
              group.appendChild(btn);
            } else {
              wrap.appendChild(btn);
            }
          }
          if (admin) {
            const pencil = document.createElement('button');
            pencil.type = 'button';
            pencil.className = 'track-edit-pencil';
            pencil.title = "edit this track's own tags";
            pencil.setAttribute('aria-label', "edit this track's own tags");
            pencil.dataset.trackKey = tk.key;
            pencil.innerHTML = '&#9998;';
            wrap.appendChild(pencil);
          }
        });
      }

      // The Drupal "video" field's YouTube clips are appended after the whole music
      // tracklist, so they read as a trailing "video" section. Set it apart from the
      // music embeds with a little breathing room + a subtle hairline. Boundary = the
      // first YouTube embed with no music (SoundCloud/Bandcamp) embed after it.
      function separateVideoSection(body) {
        const embeds = Array.prototype.slice.call(body.querySelectorAll('iframe'));
        if (!embeds.length) return;
        const isYT = (f) => /youtube\.com|youtu\.be/i.test(f.getAttribute('src') || '');
        const isMusic = (f) => /soundcloud\.com\/player|bandcamp\.com/i.test(f.getAttribute('src') || '');
        let lastMusic = -1;
        embeds.forEach((f, i) => { if (isMusic(f)) lastMusic = i; });
        if (lastMusic < 0) return;                       // no music embeds → nothing to divide
        const firstVid = embeds.find((f, i) => i > lastMusic && isYT(f));
        if (!firstVid) return;                           // no trailing video section
        const p = firstVid.closest('p') || firstVid.parentElement;
        if (!p || !p.parentNode) return;
        const hr = document.createElement('div');
        hr.className = 'modem-video-divider';
        p.parentNode.insertBefore(hr, p);
      }

      // previous/next show (or list) by number, within the same type
      function neighbors(rec, records) {
        const same = (records || []).filter((r) => r.type === rec.type);
        same.sort((a, b) => (a.number || 0) - (b.number || 0) || String(a.slug).localeCompare(String(b.slug)));
        const i = same.findIndex((r) => r.slug === rec.slug);
        return { prev: i > 0 ? same[i - 1] : null, next: i > -1 && i < same.length - 1 ? same[i + 1] : null };
      }
      function setNav(btn, target) {
        if (target) { btn.hidden = false; btn.dataset.slug = target.slug; btn.title = target.title || target.slug; }
        else { btn.hidden = true; btn.removeAttribute('data-slug'); }
      }

      // Year-end lists have no "/////" headings — each entry is a description
      // paragraph ("Artist - Title (Label)") followed by its embed. Pull the artist
      // (first link) + label (the trailing "(…)" link) out of it and append the same
      // clickable search chips alongside the entry.
      function injectListTags(body) {
        const chip = (kind, cls, n) => '<span class="chip ' + cls + ' clickable" data-kind="' + kind + '" data-name="' + esc(n) + '">' + esc(n) + '</span>';
        const artists = new Set(), labels = new Set();
        const admin = isAdmin();
        // Resolve which track (data.tracks[]) a given embed <p> is — needed to
        // attach the SAME per-track editor (tagEdits, via .track-edit-pencil) that
        // show pages already use, so an admin can fix a list entry's own tags here
        // too instead of only on whatever show also happens to feature that track.
        const tracks = (window.__modemData && window.__modemData.tracks) || [];
        // "best releases" lists are Bandcamp/SoundCloud embeds; "best videos" lists
        // are entirely YouTube (kind: 'youtube') — each needs its own id pattern
        // pulled out of embedSrc, since none of the three share a URL shape.
        const byId = {}, byYtId = {}, byScId = {};
        tracks.forEach((t) => {
          const src = t.embedSrc || '';
          const bc = src.match(/(?:album|track)=(\d+)/);
          if (bc && !byId[bc[1]]) byId[bc[1]] = t;
          if (t.kind === 'youtube') { const yt = src.match(/embed\/([\w-]+)/); if (yt) byYtId[yt[1]] = t; }
          if (t.kind === 'soundcloud') { const sc = src.match(/tracks\/(\d+)/); if (sc) byScId[sc[1]] = t; }
        });
        const trackForEmbedP = (p) => {
          const f = p && p.querySelector('iframe');
          const src = f && (f.getAttribute('src') || '');
          if (!src) return null;
          let m;
          if ((m = src.match(/(?:album|track)=(\d+)/))) return byId[m[1]] || null;
          if ((m = src.match(/youtube\.com\/embed\/([\w-]+)/))) return byYtId[m[1]] || null;
          if ((m = src.match(/api\.soundcloud\.com\/tracks\/(\d+)/))) return byScId[m[1]] || null;
          return null;
        };
        const pencilHtml = (key) => admin
          ? '<button type="button" class="track-edit-pencil" data-track-key="' + esc(key) + '" title="edit this track\'s own tags">&#9998;</button>'
          : '';
        // The page's own "★*ﾟ30 best videos...*★" intro line — not a per-entry
        // description. Shared by both passes below: pass 1 must never treat it as
        // one, and pass 2 must recognise it as "nothing came before this embed"
        // (same as another embed immediately preceding it) so the very FIRST
        // entry of an embed-only list still gets a row — otherwise it's the one
        // entry neither pass ever reaches (pass 1 skips it as a heading, pass 2's
        // old "prev has an iframe" check saw the heading has none and assumed a
        // real description must already be sitting there unprocessed).
        const isIntroHeading = (p) => !!p && p.children.length === 1 && p.children[0].tagName === 'STRONG' &&
          p.children[0].textContent.trim() === (p.textContent || '').trim();
        [...body.querySelectorAll('p')].forEach((p) => {
          if (p.querySelector('iframe')) return;              // skip embed paragraphs
          if (isIntroHeading(p)) return;
          const next = p.nextElementSibling;
          if (!next || !next.querySelector('iframe')) return; // only descriptions (immediately followed by an embed)
          const txt = (p.textContent || '').trim();
          if (!txt) return;
          // format is "ARTIST - TITLE (LABEL)": artist is before the first " - ";
          // the trailing "(...)" is the label (linked OR plain text) — unless it says
          // "self-released". "v.a."/"various artists" isn't a real artist, so skip it.
          const firstLink = p.querySelector('a');
          // artist = a leading artist link (some names run straight into "- title"
          // with no space before the dash), otherwise the text before the first " - "
          let artist;
          if (firstLink && txt.startsWith(firstLink.textContent.trim())) artist = firstLink.textContent.trim();
          else { const dash = txt.search(/\s[-–—]\s/); artist = dash > 0 ? txt.slice(0, dash).trim() : ''; }
          const pm = txt.match(/\(([^()]*)\)\s*$/);
          let label = pm ? pm[1].trim() : '';
          if (/^self[\s-]?released$/i.test(label)) label = '';
          let chips = '';
          if (artist && !/^(v\.?\s?a\.?|various\s+artists?)$/i.test(artist)) { chips += chip('artist', 'artist-chip', artist); artists.add(artist); }
          if (label && label.toLowerCase() !== artist.toLowerCase()) { chips += chip('label', 'label-chip', label); labels.add(label); }
          const tk = trackForEmbedP(next);
          const pencil = tk ? pencilHtml(tk.key) : '';
          if (!chips && !pencil) return;
          // description on the left, chips pushed to the right edge (like the shows, minus the slashes)
          p.classList.add('list-row');
          // A video's own YouTube thumbnail already shows its title + channel —
          // repeating that as a text line above it is pure duplication (unlike a
          // Bandcamp/SoundCloud embed, which doesn't always surface the label).
          // Keep the (empty) span anyway so flex still pushes the chips/pencil to
          // the right edge exactly as it does everywhere else on this page.
          const descHtml = tk && tk.kind === 'youtube' ? '' : p.innerHTML;
          p.innerHTML = '<span class="list-desc">' + descHtml + '</span><span class="list-tags">' + chips + pencil + '</span>';
        });
        // Stray embeds: some entries pack a 2nd (or 3rd) album under one description
        // with no line of its own. Give each its own entry, using the resolved
        // track's artist (from its embed) so it gets a heading + chip like the rest.
        [...body.querySelectorAll('p')].forEach((p) => {
          if (!p.querySelector('iframe')) return;
          const prev = p.previousElementSibling;
          // Needs its own row when nothing usable precedes it: either chained
          // right after another embed (no description was ever meant to exist
          // between them), or it's the very first entry in an embed-only list
          // (prev is the intro heading, not a real unprocessed description).
          if (!(prev && (prev.querySelector('iframe') || isIntroHeading(prev)))) return;
          const t = trackForEmbedP(p);
          if (!t) return;
          const pencil = pencilHtml(t.key);
          if (!t.artist && !pencil) return;
          const row = document.createElement('p');
          row.className = 'list-row';
          // Same as pass 1 above — a video's own thumbnail already shows its
          // title + channel, so the synthesized text line would just repeat it.
          const desc = (t.kind !== 'youtube' && t.artist) ? (esc(t.artist) + ((t.album || t.title) ? ' - ' + esc(t.album || t.title) : '')) : '';
          const artistChip = t.artist ? chip('artist', 'artist-chip', t.artist) : '';
          row.innerHTML = '<span class="list-desc">' + desc + '</span><span class="list-tags">' + artistChip + pencil + '</span>';
          p.parentNode.insertBefore(row, p);
