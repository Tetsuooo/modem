<script>
  // Only redirect if we're not already in the SPA context
  // Check if we're the top-level window and don't have the SPA navigation
  if (window.location.pathname !== '/' && 
      !window.location.search.includes('embedded') &&
      !document.querySelector('nav') && 
      window === window.top) {
    window.location.replace('/?redirect=' + encodeURIComponent(window.location.pathname.replace(/^\/|\.html$/g, '')));
  }
</script>

  /* Occupies roughly the same footprint the "modem" title + subtitle used to
     (same clamp() shape as their old font-size clamps, scaled up by the ratio
     between the title's rendered box and its font-size — see the sizing note in
     the slideshow script below). object-fit:contain preserves each logo's own
     aspect ratio (letterboxed within the box, never cropped or stretched), and
     image-rendering:pixelated keeps the up/downscaling crisp (no bicubic
     smoothing). */
  .modem-logo-slide {

<script>
// Set page title
document.title = 'modem';

// Randomised, fast-cycling slideshow of the modem logo variants in place of the
// old "modem" title. A shuffled queue (not a plain random pick per tick) so the
// same logo never appears twice in a row, refilled + reshuffled once exhausted.
(function () {
  const LOGO_COUNT = 108;
  const INTERVAL_MS = 150;
  const urls = Array.from({ length: LOGO_COUNT }, (_, i) => '/assets/modem_logos/modem_logo_' + (i + 1) + '.webp');
  urls.forEach((u) => { const img = new Image(); img.src = u; }); // preload

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let queue = shuffled(urls);
  const imgEl = document.getElementById('modem-logo-img');
  window.__modemLogoSlideTimer = setInterval(() => {
    if (!document.getElementById('modem-logo-img')) { window.stopModemLogoSlideshow(); return; }
    if (!queue.length) queue = shuffled(urls);
    imgEl.src = queue.pop();
  }, INTERVAL_MS);
})();

window.stopModemLogoSlideshow = function () {
  if (window.__modemLogoSlideTimer) { clearInterval(window.__modemLogoSlideTimer); window.__modemLogoSlideTimer = null; }
};

// Clean up function to remove social icons
window.removeHomeSocialIcons = function() {
  const existingSocialIcons = document.getElementById('home-social-icons');
  if (existingSocialIcons) {
    existingSocialIcons.remove();
  }
};

// Function to create social icons

    align-items: center;

  `;
  socialIcons.innerHTML = `

    <a href="https://www.facebook.com/modemodemodem/" title="Facebook" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">fb</a>
    <a href="https://soundcloud.com/modemodemodem" title="SoundCloud" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">sc</a>

    <a href="https://discord.gg/ugRXHDQk7h" title="Discord" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">discord</a>
    <a href="mailto:podcastmodem@gmail.com" title="Email" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">mail</a>

</script>
