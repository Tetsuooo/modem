<script>
  // Only redirect if we're not already in the SPA context
  // Check if we're the top-level window and don't have the SPA navigation
  if (window.location.pathname !== '/' && 
      !window.location.search.includes('embedded') &&
      !document.querySelector('nav') && 
      window === window.top) {
    window.location.replace('/?redirect=' + encodeURIComponent(window.location.pathname.replace(/^\/|\.html$/g, '')));
  }
</script>
<style>

  /* Occupies roughly the same footprint the "modem" title + subtitle used to
     (same clamp() shape as their old font-size clamps, scaled up by the ratio
     between the title's rendered box and its font-size — see the sizing note in
     the slideshow script below). This is the MAX area a logo can fill; the
     script below sizes each <img> in px (not 100%/object-fit) so a logo that's
     natively much smaller than the others renders smaller too, not blown up to
     match — see sizeLogo() for the exact scale. image-rendering:pixelated keeps
     any up/downscaling crisp (no bicubic smoothing). */
  .modem-logo-slide {

<script>
// Set page title
document.title = 'modem';

// Randomised, fast-cycling slideshow of the modem logo variants in place of the
// old "modem" title. A shuffled queue (not a plain random pick per tick) so the
// same logo never appears twice in a row, refilled + reshuffled once exhausted.
(function () {
  const INTERVAL_MS = 150;
  // Each logo's native pixel size (modem_logo_1..108, in order) — used to size
  // it down from "fill the box" so a logo that's natively much smaller than the
  // others still reads as smaller, not blown up to match. Not a straight scale
  // to native resolution (some are tiny, e.g. 127x52) — see sizeFor() below.
  const DIMS = [[1148,396],[1454,819],[612,100],[164,82],[176,219],[214,69],[296,48],[542,84],[440,178],[905,411],[275,325],[423,107],[204,83],[263,96],[206,118],[788,58],[790,407],[390,102],[353,104],[175,175],[232,68],[205,103],[744,163],[176,63],[205,92],[450,375],[518,278],[697,392],[352,89],[298,121],[506,301],[755,277],[917,189],[517,218],[1190,670],[408,89],[274,272],[142,49],[151,76],[155,109],[171,51],[196,68],[434,173],[589,336],[187,67],[186,81],[275,97],[288,84],[349,152],[533,97],[442,45],[1820,528],[552,122],[178,72],[380,108],[141,57],[198,196],[193,80],[258,84],[340,94],[461,292],[692,166],[378,83],[299,60],[298,42],[651,142],[669,95],[402,202],[418,146],[248,48],[981,415],[994,419],[315,193],[158,131],[719,245],[269,96],[332,114],[233,175],[203,73],[170,42],[223,96],[128,46],[714,143],[331,384],[287,58],[192,145],[349,71],[603,126],[373,52],[127,52],[225,106],[376,161],[774,413],[580,101],[200,101],[314,43],[626,165],[494,213],[904,418],[229,81],[357,85],[288,65],[1371,277],[746,150],[657,56],[657,82],[212,123],[277,74]];
  const urls = DIMS.map((_, i) => '/assets/modem_logos/modem_logo_' + (i + 1) + '.webp');
  urls.forEach((u) => { const img = new Image(); img.src = u; }); // preload

  let maxAreaIdx = 0;
  DIMS.forEach((d, i) => { if (d[0] * d[1] > DIMS[maxAreaIdx][0] * DIMS[maxAreaIdx][1]) maxAreaIdx = i; });
  const maxArea = DIMS[maxAreaIdx][0] * DIMS[maxAreaIdx][1];

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const slideEl = document.querySelector('.modem-logo-slide');
  const imgEl = document.getElementById('modem-logo-img');

  // Size relative to native AREA, blended with equal-fill so nothing goes
  // microscopic. Critically, the base "fill" scale is computed ONCE from the
  // single biggest-area logo — not per-image from each logo's own dimensions
  // (that was the earlier bug: a per-image contain-fit scale is inversely
  // proportional to that image's own size, so it silently cancelled the native-
  // size signal back out — a tiny image got a proportionally huge base scale,
  // making the final sizes correlate with aspect ratio more than actual size).
  // factor 0.78 (smallest) .. 0.9 (the biggest logo — no longer fills the box
  // edge to edge, so even the max size reads a bit more restrained) — sqrt()
  // converts the area ratio to a linear-size ratio. The safety cap only
  // matters for an unusually oblong logo that would otherwise overflow the
  // box at this scale.
  // A floor on the factor formula alone can't reach a ~10:1 spread: the single
  // biggest logo (1454x819) is natively 11.4x wider than the single smallest
  // (128x46), so even a completely FLAT factor (no correlation at all) still
  // produces an 11.4:1 gap between those two — any correlation on top of that
  // only widens it further. So the tail is handled separately: MIN_FILL_FRAC
  // guarantees a logo's longer edge (as a fraction of the box) never drops
  // below a floor, pulling in only the few most extreme outliers without
  // touching the formula's correlation for everything else.
  const MIN_FILL_FRAC = 0.09;
  function sizeFor(idx) {
    const [nw, nh] = DIMS[idx];
    const box = slideEl.getBoundingClientRect();
    const [refW, refH] = DIMS[maxAreaIdx];
    const refScale = Math.min(box.width / refW, box.height / refH);
    const nativeRatio = Math.sqrt((nw * nh) / maxArea);
    const factor = 0.78 + 0.12 * nativeRatio;
    const capScale = Math.min(box.width / nw, box.height / nh);
    const scale = Math.min(refScale * factor, capScale);
    let w = nw * scale, h = nh * scale;
    const fillFrac = Math.max(w / box.width, h / box.height);
    if (fillFrac < MIN_FILL_FRAC) {
      const bump = MIN_FILL_FRAC / fillFrac;
      w *= bump; h *= bump;
    }
    return { w, h };
  }

  let queue = shuffled(DIMS.map((_, i) => i));
  window.__modemLogoSlideTimer = setInterval(() => {
    if (!document.getElementById('modem-logo-img')) { window.stopModemLogoSlideshow(); return; }
    if (!queue.length) queue = shuffled(DIMS.map((_, i) => i));
    const idx = queue.pop();
    const { w, h } = sizeFor(idx);
    imgEl.style.width = w + 'px';
    imgEl.style.height = h + 'px';
    imgEl.src = urls[idx];
  }, INTERVAL_MS);
})();

window.stopModemLogoSlideshow = function () {
  if (window.__modemLogoSlideTimer) { clearInterval(window.__modemLogoSlideTimer); window.__modemLogoSlideTimer = null; }
};

};

  `;
  socialIcons.innerHTML = `
    <a href="https://www.instagram.com/modemodemodem/" title="Instagram" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">ig</a>
    <a href="https://www.facebook.com/modemodemodem/" title="Facebook" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">fb</a>
    <a href="https://soundcloud.com/modemodemodem" title="SoundCloud" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">sc</a>
    <a href="https://modemodemodem.bandcamp.com/music" title="Bandcamp" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">bc</a>
    <a href="https://www.youtube.com/watch?v=M--MVB9owgc" title="YouTube" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">yt</a>
    <a href="https://discord.gg/ugRXHDQk7h" title="Discord" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">discord</a>
    <a href="mailto:podcastmodem@gmail.com" title="Email" style="text-decoration: none; color: black; font-size: clamp(0.7rem, 2.8vw, 1.4rem); transform: scaleY(2);">mail</a>
  `;
  document.body.appendChild(socialIcons);
};

// Create the social icons immediately
window.createHomeSocialIcons();
</script>
