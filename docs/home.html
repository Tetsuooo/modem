// Randomised, fast-cycling slideshow of the modem logo variants in place of the
// old "modem" title. A shuffled queue (not a plain random pick per tick) so the
// same logo never appears twice in a row, refilled + reshuffled once exhausted.
(function () {
  const INTERVAL_MS = 150;
  // Each logo's native pixel size (modem_logo_1..108, in order) — used to size
  // it down from "fill the box" so a logo that's natively much smaller than the
  // others still reads as smaller, not blown up to match. Not a straight scale
  // to native resolution (some are tiny, e.g. 127x52) — see sizeFor() below.
  const DIMS = [[1148,396],[1454,819],[612,100],[164,82],[176,219],[214,69],[296,48],[542,84],[440,178],[905,411],[275,325],[423,107],[204,83],[263,96],[206,118],[788,58],[790,407],[390,102],[353,104],[175,175],[232,68],[205,103],[744,163],[176,63],[205,92],[450,375],[518,278],[697,392],[352,89],[298,121],[506,301],[755,277],[917,189],[517,218],[1190,670],[408,89],[274,272],[142,49],[151,76],[155,109],[171,51],[196,68],[434,173],[589,336],[187,67],[186,81],[275,97],[288,84],[349,152],[533,97],[442,45],[1820,528],[552,122],[178,72],[380,108],[141,57],[198,196],[193,80],[258,84],[340,94],[461,292],[692,166],[378,83],[299,60],[298,42],[651,142],[669,95],[402,202],[418,146],[248,48],[981,415],[994,419],[315,193],[158,131],[719,245],[269,96],[332,114],[233,175],[203,73],[170,42],[223,96],[128,46],[714,143],[331,384],[287,58],[192,145],[349,71],[603,126],[373,52],[127,52],[225,106],[376,161],[774,413],[580,101],[200,101],[314,43],[626,165],[494,213],[904,418],[229,81],[357,85],[288,65],[1371,277],[746,150],[657,56],[657,82],[212,123],[277,74]];
  const urls = DIMS.map((_, i) => '/assets/modem_logos/modem_logo_' + (i + 1) + '.webp');
  urls.forEach((u) => { const img = new Image(); img.src = u; }); // preload

  let maxAreaIdx = 0;
  DIMS.forEach((d, i) => { if (d[0] * d[1] > DIMS[maxAreaIdx][0] * DIMS[maxAreaIdx][1]) maxAreaIdx = i; });
  const maxArea = DIMS[maxAreaIdx][0] * DIMS[maxAreaIdx][1];

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const slideEl = document.querySelector('.modem-logo-slide');
  const imgEl = document.getElementById('modem-logo-img');

  // Size relative to native AREA, blended with equal-fill so nothing goes
  // microscopic. Critically, the base "fill" scale is computed ONCE from the
  // single biggest-area logo — not per-image from each logo's own dimensions
  // (that was the earlier bug: a per-image contain-fit scale is inversely
  // proportional to that image's own size, so it silently cancelled the native-
  // size signal back out — a tiny image got a proportionally huge base scale,
  // making the final sizes correlate with aspect ratio more than actual size).
  // factor 0.65 (smallest) .. 0.75 (biggest by AREA) — sqrt() converts the
  // area ratio to a linear-size ratio. The safety cap only matters for an
  // unusually oblong logo that would otherwise overflow the box at this scale.
  //
  // Area isn't the same as rendered size once aspect ratios differ: logo #52
  // (1820x528) has less native AREA than the #2 reference (1454x819) but is
  // considerably WIDER, so the same area-based factor renders it bigger than
  // the "biggest" reference — the factor curve alone can't guarantee a hard
  // ratio across 108 varied aspect ratios. So MIN_FILL_FRAC / MAX_FILL_FRAC
  // hard-clamp every logo's longer edge (as a fraction of the box) into
  // [MIN, MAX], guaranteeing the MAX/MIN spread ratio by construction
  // regardless of which specific logo ends up biggest/smallest. At a tight
  // 3:1 ratio most of the set sits at one clamp or the other; only logos
  // whose native area falls between the two reference points show any
  // formula-driven variation.
  // NOTE: MIN isn't simply MAX/3 — the tightest floor case and the ceiling
  // case bind on different box axes (one width-constrained, one
  // height-constrained), and the box isn't square, so a naive MAX/3 measured
  // ~3.78:1 in practice. This value is tuned against the actual rendered
  // long-edge across all 108 logos (see the scratch verification script) to
  // land the real max/min ratio at 3.0, not just the formula's nominal one.
  const MAX_FILL_FRAC = 0.75;
  const MIN_FILL_FRAC = 0.3152;
  function sizeFor(idx) {
    const [nw, nh] = DIMS[idx];
    const box = slideEl.getBoundingClientRect();
    const [refW, refH] = DIMS[maxAreaIdx];
    const refScale = Math.min(box.width / refW, box.height / refH);
    const nativeRatio = Math.sqrt((nw * nh) / maxArea);
    const factor = 0.65 + 0.10 * nativeRatio;
    const capScale = Math.min(box.width / nw, box.height / nh);
    const scale = Math.min(refScale * factor, capScale);
    let w = nw * scale, h = nh * scale;
    const fillFrac = Math.max(w / box.width, h / box.height);
    if (fillFrac > MAX_FILL_FRAC) {
      const shrink = MAX_FILL_FRAC / fillFrac;
      w *= shrink; h *= shrink;
    } else if (fillFrac < MIN_FILL_FRAC) {
      const bump = MIN_FILL_FRAC / fillFrac;
      w *= bump; h *= bump;
    }
    return { w, h };
  }

  let queue = shuffled(DIMS.map((_, i) => i));
  let timer = null;

  function tick() {
    if (!document.getElementById('modem-logo-img')) { stop(); return; }
    if (!queue.length) queue = shuffled(DIMS.map((_, i) => i));
    const idx = queue.pop();
    const { w, h } = sizeFor(idx);
    imgEl.style.width = w + 'px';
    imgEl.style.height = h + 'px';
    imgEl.src = urls[idx];
  }
  function start() { if (!timer) timer = setInterval(tick, INTERVAL_MS); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  start();
  // Click the logo to pause/resume the slideshow on the current frame.
  slideEl.style.cursor = 'pointer';
  slideEl.addEventListener('click', () => { if (timer) stop(); else start(); });

  window.stopModemLogoSlideshow = stop;
})();
